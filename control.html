<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>iPad Monitor Control</title>

  <style>
    body {
      margin: 0;
      background: #050505;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      padding: 16px;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 4px;
    }

    .status {
      color: #aaa;
      margin-bottom: 20px;
      font-size: 0.95rem;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .control-card {
      border: 1px solid #333;
      border-radius: 12px;
      padding: 14px;
      background: #111;
    }

    .label {
      font-size: 1rem;
      color: #ccc;
      margin-bottom: 10px;
    }

    .value {
      font-size: 2rem;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .button-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      flex: 1;
      min-width: 90px;
      background: #222;
      color: white;
      border: 1px solid #666;
      border-radius: 10px;
      padding: 14px;
      font-size: 1rem;
      cursor: pointer;
    }

    button:active {
      background: #444;
    }

    .reset {
      border-color: #ff5555;
      color: #ff7777;
      margin-top: 20px;
      width: 100%;
    }

    .scenario {
      color: #ffd400;
      font-size: 1rem;
      margin-top: 18px;
    }
    .top-info {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 18px;
}

.timer-display {
  color: #00ccff;
  font-size: 1.2rem;
  font-weight: bold;
}

/* Compact collapsible pupil controls */
.pupil-summary { cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:1rem; color:#ddd; }
.pupil-summary strong { color:#fff; }
.pupil-summary .pupil-current { font-size:.82rem; color:#00ccff; text-align:right; }
.pupil-settings { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:14px; }
.pupil-eye { min-width:0; border:1px solid #333; border-radius:9px; padding:10px; background:#181818; }
.pupil-eye h3 { margin:0 0 10px; font-size:.95rem; }
.pupil-eye label { display:block; font-size:.8rem; color:#bbb; margin:9px 0 4px; }
.pupil-eye input { width:100%; min-width:0; font-size:1.05rem; padding:9px 5px; border-radius:7px; border:1px solid #666; background:#080808; color:white; text-align:center; }
.pupil-speed { display:flex; gap:4px; }
.pupil-speed button { min-width:0; flex:1; padding:9px 2px; font-size:.75rem; border-radius:6px; }
.pupil-speed button.selected { background:#145e91; border-color:#4bbcff; }
.pupil-speed button:disabled { opacity:.4; }
.pupil-code { color:#aaa; font-size:.78rem; margin-top:9px; }
.pupil-actions { display:flex; gap:8px; margin-top:12px; }
.pupil-actions button { min-width:0; padding:11px 6px; font-size:.88rem; }
#pupilFeedback { font-size:.8rem; color:#aaa; margin-top:8px; min-height:1em; }
  </style>
</head>

<body>
  <h1>Monitor Control</h1>
  <div class="status" id="connectionStatus">Connecting...</div>
<div class="scenario">
    Scenario: <span id="scenarioValue">--</span>
    <div class="timer-display">
    Sim timer: <span id="timerValue">00:00</span>
  </div>
  </div>
  <div class="grid">
    <div class="control-card">
  <div class="label">Simulation Control</div>

  <div class="button-row">
    <button onclick="showEndOfSimPopup()">End of Sim</button>
    <button onclick="clearEndOfSimPopup()">Clear Message</button>
  </div>
</div>
<div class="control-card">
  <div class="label">Autoregulation Sim</div>

  <div class="button-row">
    <button onclick="simStartKinked()">Start SIM</button>
    <button onclick="simBasicCare()">Optimise position</button>
  </div>

  <div class="button-row">
    <button onclick="simAgitatedRise()">Agitation ICP rise</button>
    <button onclick="simNoradEarly()">Norad before sedation</button>
  </div>

  <div class="button-row">
    <button onclick="simSedationFirst()">Sedation increased</button>
    <button onclick="simNoradAfterSedation()">Norad after sedation</button>
  </div>
</div>
    <div class="control-card">
      <div class="label">Heart Rate</div>
      <div class="value"><span id="hrValue">--</span> bpm</div>
      <div class="button-row">
        <button onclick="changeValue('hr', -5)">HR -5</button>
        <button onclick="changeValue('hr', 5)">HR +5</button>
      </div>
    </div>

    <div class="control-card">
      <div class="label">Systolic BP</div>
      <div class="value"><span id="sysValue">--</span> mmHg</div>
      <div class="button-row">
        <button onclick="changeValue('systolic', -5)">Sys -5</button>
        <button onclick="changeValue('systolic', 5)">Sys +5</button>
      </div>
    </div>

    <div class="control-card">
      <div class="label">Diastolic BP</div>
      <div class="value"><span id="diaValue">--</span> mmHg</div>
      <div class="button-row">
        <button onclick="changeValue('diastolic', -5)">Dia -5</button>
        <button onclick="changeValue('diastolic', 5)">Dia +5</button>
      </div>
    </div>

    <div class="control-card">
      <div class="label">ICP</div>
      <div class="value"><span id="icpValue">--</span> mmHg</div>
      <div class="button-row">
        <button onclick="changeValue('icp', -1)">ICP -1</button>
        <button onclick="changeValue('icp', 1)">ICP +1</button>
      </div>
    </div>
<div class="control-card">
  <div class="label">Respiratory Rate</div>
  <div class="value"><span id="rrValue">--</span> /min</div>
  <div class="button-row">
    <button onclick="changeValue('rr', -1)">RR -1</button>
    <button onclick="changeValue('rr', 1)">RR +1</button>
  </div>
</div>
<div class="control-card">
  <div class="label">SpO₂</div>
  <div class="value"><span id="spo2Value">--</span> %</div>
  <div class="button-row">
    <button onclick="changeValue('spo2', -1)">SpO₂ -1</button>
    <button onclick="changeValue('spo2', 1)">SpO₂ +1</button>
  </div>
</div>
<div class="control-card">
  <div class="label">EtCO₂</div>
  <div class="value"><span id="etco2Value">--</span> kPa</div>
  <div class="button-row">
    <button onclick="changeValue('etco2', -0.1)">EtCO₂ -0.1</button>
    <button onclick="changeValue('etco2', 0.1)">EtCO₂ +0.1</button>
  </div>
</div>
  
<div class="control-card">
  <div class="label">Wave Controls</div>
  <div class="button-row">
    <button onclick="toggleWave('showIcpWave')">ICP</button>
    <button onclick="toggleWave('showArtWave')">ART Line</button>
    <button onclick="toggleWave('showEtco2Wave')">EtCO₂</button>
  </div>
</div>

  </div>  

<button class="reset" onclick="resetPatient()">Reset Baseline</button>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <script>
    // ------------------------------
    // Firebase setup
    // ------------------------------

    const firebaseConfig = {
      apiKey: "AIzaSyDQOx2eQRwPFlHC2EmQREtdFYb9Mha7zuQ",
      authDomain: "neuro-itu-monitor-sim.firebaseapp.com",
      databaseURL: "https://neuro-itu-monitor-sim-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "neuro-itu-monitor-sim",
      storageBucket: "neuro-itu-monitor-sim.firebasestorage.app",
      messagingSenderId: "610257056899",
      appId: "1:610257056899:web:4763a538136eaf95a8d7b6"
    };

    firebase.initializeApp(firebaseConfig);

    const database = firebase.database();
    const roomRef = database.ref("simRooms/neuro1");

    // ------------------------------
    // Local state
    // ------------------------------

    let patient = {
      hr: 86,
      spo2: 98,
      systolic: 120,
      diastolic: 70,
      icp: 14,
      rr: 16,
      etco2: 4.3,
      showIcpWave: true,
      showArtWave: true,
      showEtco2Wave: true,
      scenario: "Baseline",
      sedationGiven: false,
      timerSeconds: 0,
      timerRunning: false,
timerStartedAt: null
    };

    const baselinePatient = {
      hr: 86,
      spo2: 98,
      systolic: 120,
      diastolic: 70,
      icp: 14,
      rr: 16,
      etco2: 4.3,
      showIcpWave: true,
      showArtWave: true,
      showEtco2Wave: true,
      scenario: "Baseline",
      sedationGiven: false,
      timerSeconds: 0,
      timerRunning: false,
timerStartedAt: null
    };

    // ------------------------------
    // Listen for Firebase changes
    // ------------------------------

    roomRef.on("value", (snapshot) => {
      const data = snapshot.val();

      if (!data) {
        document.getElementById("connectionStatus").textContent = "No data found";
        return;
      }

      patient = data;
      syncPupilControls(data);

      document.getElementById("connectionStatus").textContent = "Connected to neuro1";
      updateControlDisplay();
    });
function formatTimer(seconds) {
  const minutes = Math.floor(seconds / 60);
  const remainingSeconds = seconds % 60;

  return (
    String(minutes).padStart(2, "0") +
    ":" +
    String(remainingSeconds).padStart(2, "0")
  );
}
    // ------------------------------
    // Display update
    // ------------------------------

    function updateControlDisplay() {
  document.getElementById("hrValue").textContent = patient.hr;
  document.getElementById("sysValue").textContent = patient.systolic;
  document.getElementById("diaValue").textContent = patient.diastolic;
  document.getElementById("icpValue").textContent = patient.icp;
  document.getElementById("rrValue").textContent = patient.rr;
  document.getElementById("spo2Value").textContent = patient.spo2;
  document.getElementById("etco2Value").textContent = Number(patient.etco2).toFixed(1);
  document.getElementById("scenarioValue").textContent = patient.scenario;

  let totalSeconds = patient.timerSeconds || 0;

if (patient.timerRunning && patient.timerStartedAt) {
  totalSeconds = Math.floor((Date.now() - patient.timerStartedAt) / 1000);
}

document.getElementById("timerValue").textContent =
  formatTimer(totalSeconds);
}

    // ------------------------------
    // Controls
    // ------------------------------

    function changeValue(parameter, amount) {
      const updatedPatient = { ...patient };

      updatedPatient[parameter] += amount;

updatedPatient.hr = clamp(updatedPatient.hr, 0, 220);
updatedPatient.systolic = clamp(updatedPatient.systolic, 30, 240);
updatedPatient.diastolic = clamp(updatedPatient.diastolic, 20, 140);
updatedPatient.icp = clamp(updatedPatient.icp, -5, 80);
updatedPatient.rr = clamp(updatedPatient.rr, 0, 60);
updatedPatient.spo2 = clamp(updatedPatient.spo2, 50, 100);
updatedPatient.etco2 = clamp(updatedPatient.etco2, 1.0, 12.0);
updatedPatient.etco2 = Math.round(updatedPatient.etco2 * 10) / 10;

      if (updatedPatient.systolic <= updatedPatient.diastolic) {
        updatedPatient.systolic = updatedPatient.diastolic + 5;
      }

      updatedPatient.scenario = "Manual control";

      roomRef.update(updatedPatient);
    }
    function toggleWave(waveName) {
  const updatedPatient = { ...patient };

  updatedPatient[waveName] = !updatedPatient[waveName];
  updatedPatient.scenario = "Manual wave control";

  roomRef.update(updatedPatient);
}
function showEndOfSimPopup() {
  roomRef.update({
    monitorMessage: "END OF SIM",
    showMonitorMessage: true
  });
}

function clearEndOfSimPopup() {
  roomRef.update({
    monitorMessage: "",
    showMonitorMessage: false
  });
}
    function resetPatient() {
  clearGradualChanges();
  stopSimTimer();
  roomRef.set({ ...baselinePatient, pupilLeft: "321", pupilRight: "321" });
}

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    // ------------------------------
// Gradual Firebase updates maybe
// ------------------------------

let activeIntervals = [];
let simTimerInterval = null;

function clearGradualChanges() {
  activeIntervals.forEach(interval => clearInterval(interval));
  activeIntervals = [];
}

function writePatient(updatedPatient) {
  patient = { ...patient, ...updatedPatient };
  roomRef.update(patient);
}

function gradualChange(parameter, targetValue, stepAmount, delayMs) {
  const interval = setInterval(() => {
    if (patient[parameter] === targetValue) {
      clearInterval(interval);
      activeIntervals = activeIntervals.filter(item => item !== interval);
      return;
    }

    const updatedPatient = { ...patient };

    if (updatedPatient[parameter] < targetValue) {
      updatedPatient[parameter] = Math.min(updatedPatient[parameter] + stepAmount, targetValue);
    } else {
      updatedPatient[parameter] = Math.max(updatedPatient[parameter] - stepAmount, targetValue);
    }

    writePatient(updatedPatient);
  }, delayMs);

  activeIntervals.push(interval);
}
function timedIntChangeOverTime(parameter, startValue, targetValue, totalMs) {
  const startTime = Date.now();

  const interval = setInterval(() => {
    const elapsed = Date.now() - startTime;
    const progress = Math.min(elapsed / totalMs, 1);

    const newValue = Math.round(
      startValue + ((targetValue - startValue) * progress)
    );

    const updatedPatient = { ...patient };
    updatedPatient[parameter] = newValue;

    writePatient(updatedPatient);

    if (progress >= 1) {
      clearInterval(interval);
      activeIntervals = activeIntervals.filter(item => item !== interval);
    }
  }, 1000);

  activeIntervals.push(interval);
}
function gradualIntChangeOverTime(parameter, targetValue, totalMs) {
  const startValue = patient[parameter];
  const difference = targetValue - startValue;
  const steps = Math.abs(difference);

  if (steps === 0) return;

  const stepDirection = difference > 0 ? 1 : -1;
  const delayMs = totalMs / steps;

  const interval = setInterval(() => {
    if (patient[parameter] === targetValue) {
      clearInterval(interval);
      activeIntervals = activeIntervals.filter(item => item !== interval);
      return;
    }

    const updatedPatient = { ...patient };
    updatedPatient[parameter] += stepDirection;

    writePatient(updatedPatient);
  }, delayMs);

  activeIntervals.push(interval);
}
function timedDecimalChangeOverTime(parameter, startValue, targetValue, stepAmount, totalMs) {
  const startTime = Date.now();

  const interval = setInterval(() => {
    const elapsed = Date.now() - startTime;
    const progress = Math.min(elapsed / totalMs, 1);

    const updatedPatient = { ...patient };

    updatedPatient[parameter] =
      startValue + ((targetValue - startValue) * progress);

    updatedPatient[parameter] =
      Math.round(updatedPatient[parameter] / stepAmount) * stepAmount;

    updatedPatient[parameter] =
      Math.round(updatedPatient[parameter] * 10) / 10;

    writePatient(updatedPatient);

    if (progress >= 1) {
      clearInterval(interval);
      activeIntervals = activeIntervals.filter(item => item !== interval);
    }
  }, 1000);

  activeIntervals.push(interval);
}
function gradualDecimalChangeOverTime(parameter, targetValue, stepAmount, totalMs) {
  const startValue = patient[parameter];
  const difference = targetValue - startValue;
  const steps = Math.ceil(Math.abs(difference) / stepAmount);

  if (steps === 0) return;

  const delayMs = totalMs / steps;

  const interval = setInterval(() => {
    const updatedPatient = { ...patient };

    if (Math.abs(updatedPatient[parameter] - targetValue) < stepAmount) {
      updatedPatient[parameter] = targetValue;
      writePatient(updatedPatient);

      clearInterval(interval);
      activeIntervals = activeIntervals.filter(item => item !== interval);
      return;
    }

    if (updatedPatient[parameter] < targetValue) {
      updatedPatient[parameter] += stepAmount;
    } else {
      updatedPatient[parameter] -= stepAmount;
    }

    updatedPatient[parameter] = Math.round(updatedPatient[parameter] * 10) / 10;

    writePatient(updatedPatient);
  }, delayMs);

  activeIntervals.push(interval);
}

// ------------------------------
// Sim timer
// ------------------------------

function startSimTimer() {
  roomRef.update({
    timerSeconds: 0,
    timerRunning: true,
    timerStartedAt: Date.now()
  });
}

function stopSimTimer() {
  roomRef.update({
    timerRunning: false
  });
}

// ------------------------------
// Autoregulation Sim Logic
// ------------------------------

function simStartKinked() {
  clearGradualChanges();
  startSimTimer();

  writePatient({
    hr: 86,
    spo2: 98,
    systolic: 120,
    diastolic: 70,
    icp: 14,
    rr: 16,
    etco2: 4.,
    scenario: "Start: deterioration over 2 minutes",
    sedationGiven: false,
    
  });

  const twoMinutes = 120000;

  timedIntChangeOverTime("hr", 86, 88, twoMinutes);
timedIntChangeOverTime("spo2", 98, 97, twoMinutes);
timedIntChangeOverTime("systolic", 120, 125, twoMinutes);
timedIntChangeOverTime("diastolic", 70, 65, twoMinutes);
timedIntChangeOverTime("icp", 14, 26, twoMinutes);
timedDecimalChangeOverTime("etco2", 4.8, 4.6, 0.1, twoMinutes);
}

function simBasicCare() {
  clearGradualChanges();

  writePatient({
    scenario: "Basic nursing care: head up / neutral neck"
  });

  gradualChange("icp", clamp(patient.icp - 10, 0, 80), 1, 2000);
 gradualChange("systolic", clamp(patient.systolic - 4, 50, 240), 2, 3000);
gradualChange("diastolic", clamp(patient.diastolic - 2, 20, 140), 1, 3000);
}

function simAgitatedRise() {
  clearGradualChanges();

  writePatient({
    scenario: "Awake / agitated: ICP rising",
    sedationGiven: false
  });

  gradualChange("hr", clamp(patient.hr + 12, 30, 220), 3, 2000);
  gradualChange("systolic", clamp(patient.systolic + 22, 50, 240), 4, 2000);
  gradualChange("diastolic", clamp(patient.diastolic + 10, 20, 140), 2, 2000);
  gradualChange("icp", clamp(patient.icp + 16, 0, 80), 2, 2000);
  
}

function simNoradEarly() {
  clearGradualChanges();

  writePatient({
    scenario: "Norad before sedation: ICP worsens"
  });

  gradualChange("systolic", clamp(patient.systolic + 25, 50, 240), 5, 2000);
  gradualChange("diastolic", clamp(patient.diastolic + 5, 20, 140), 2, 2000);
  gradualChange("icp", clamp(patient.icp + 11, 0, 80), 2, 2000);
  gradualChange("hr", clamp(patient.hr - 4, 30, 220), 1, 3000);
}

function simSedationFirst() {
  clearGradualChanges();

  writePatient({
    scenario: "Sedation increased: ICP improving",
    sedationGiven: true
  });

  gradualChange("hr", clamp(patient.hr - 15, 30, 220), 3, 2000);
  gradualChange("systolic", clamp(patient.systolic - 18, 50, 240), 3, 2000);
  gradualChange("diastolic", clamp(patient.diastolic - 8, 20, 140), 2, 2000);
  gradualChange("icp", clamp(patient.icp - 14, 0, 80), 2, 2000);
  gradualChange("etco2", clamp(patient.etco2 + 0.2, 1.0, 12.0), 0.1, 3000);
}

function simNoradAfterSedation() {
  clearGradualChanges();

  if (!patient.sedationGiven) {
    simNoradEarly();
    return;
  }

  writePatient({
    scenario: "Norad after sedation: CPP improving"
  });

  gradualChange("systolic", clamp(patient.systolic + 24, 50, 240), 4, 2000);
  gradualChange("diastolic", clamp(patient.diastolic + 12, 20, 140), 2, 2000);
  gradualChange("hr", clamp(patient.hr - 4, 30, 220), 1, 3000);
  gradualChange("icp", clamp(patient.icp - 2, 0, 80), 1, 4000);
}

// ------------------------------
// Independent pupil settings
// ------------------------------
const pupilDraft = {
  Left: { start:3, end:2, speed:"1" },
  Right: { start:3, end:2, speed:"1" }
};
let pupilEditing = false;
let lastFirebasePupils = { Left:null, Right:null };

function validPupilCode(value) {
  const code = String(value ?? "");
  if (!/^[1-6][1-6][012]$/.test(code)) return false;
  const a = Number(code[0]), b = Number(code[1]), r = code[2];
  return b <= a && (a === b ? r === "0" : r !== "0");
}

function pupilCode(eye) {
  const d = pupilDraft[eye];
  const a = Number(d.start), b = Number(d.end);
  if (!Number.isInteger(a) || !Number.isInteger(b) ||
      a < 1 || a > 6 || b < 1 || b > 6 || b > a) return null;
  return `${a}${b}${a === b ? "0" : d.speed}`;
}

function renderPupilDraft() {
  for (const eye of ["Left", "Right"]) {
    const d = pupilDraft[eye];
    const start = document.getElementById(`pupil${eye}Start`);
    const end = document.getElementById(`pupil${eye}End`);
    if (document.activeElement !== start) start.value = d.start;
    if (document.activeElement !== end) end.value = d.end;
    const fixed = Number(d.start) === Number(d.end);
    document.querySelectorAll(`[data-eye="${eye}"]`).forEach(button => {
      button.classList.toggle("selected", !fixed && button.dataset.speed === d.speed);
      button.disabled = fixed;
    });
    document.getElementById(`pupil${eye}Preview`).textContent =
      pupilCode(eye) || "Invalid size";
  }
}

function syncPupilControls(data) {
  const left = String(data.pupilLeft ?? "");
  const right = String(data.pupilRight ?? "");
  document.getElementById("pupilSummary").textContent =
    `L ${left || "--"} · R ${right || "--"}`;
  // Do not overwrite partially entered settings while the section is open.
  if (pupilEditing) return;
  for (const [eye, code] of [["Left",left],["Right",right]]) {
    if (!validPupilCode(code)) continue;
    pupilDraft[eye] = {
      start:Number(code[0]), end:Number(code[1]),
      speed:code[2] === "2" ? "2" : "1"
    };
    lastFirebasePupils[eye] = code;
  }
  renderPupilDraft();
}

for (const eye of ["Left", "Right"]) {
  for (const part of ["Start", "End"]) {
    document.getElementById(`pupil${eye}${part}`).addEventListener("input", e => {
      pupilEditing = true;
      pupilDraft[eye][part.toLowerCase()] = e.target.value;
      renderPupilDraft();
    });
  }
}
document.querySelectorAll("[data-eye][data-speed]").forEach(button => {
  button.addEventListener("click", () => {
    pupilEditing = true;
    pupilDraft[button.dataset.eye].speed = button.dataset.speed;
    renderPupilDraft();
  });
});

document.getElementById("applyPupils").addEventListener("click", async () => {
  const left = pupilCode("Left"), right = pupilCode("Right");
  const feedback = document.getElementById("pupilFeedback");
  if (!left || !right) {
    feedback.textContent = "Use 1–6 mm; finish cannot exceed start.";
    return;
  }
  try {
    await roomRef.update({ pupilLeft:left, pupilRight:right });
    pupilEditing = false;
    feedback.textContent = `Applied: L ${left} · R ${right}`;
    syncPupilControls({pupilLeft:left,pupilRight:right});
  } catch (error) {
    feedback.textContent = "Could not save pupils: " + error.message;
  }
});

document.getElementById("pearlPupils").addEventListener("click", async () => {
  const feedback = document.getElementById("pupilFeedback");
  try {
    await roomRef.update({ pupilLeft:"321", pupilRight:"321" });
    pupilEditing = false;
    feedback.textContent = "PEARL applied: both 321";
    syncPupilControls({pupilLeft:"321",pupilRight:"321"});
  } catch (error) {
    feedback.textContent = "Could not apply PEARL: " + error.message;
  }
});

document.getElementById("pupilDetails").addEventListener("toggle", event => {
  if (!event.target.open) {
    pupilEditing = false;
    if (patient) syncPupilControls(patient);
  }
});
renderPupilDraft();

setInterval(updateControlDisplay, 1000);
  </script>
</body>
