<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ITU Monitor Sim</title>

  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    .monitor {
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: auto 1fr auto;
      gap: 12px;
      padding: 14px;
      box-sizing: border-box;
    }

    .header {
  grid-column: 1 / 4;
  height: 54px;
  display: grid;
  grid-template-columns: 1fr 360px 1fr;
  align-items: center;
  border-bottom: 2px solid #333;
  padding-bottom: 0;
  font-size: 1.2rem;
  color: #ccc;
}

.bed-label {
  grid-column: 1;
  justify-self: start;
  font-size: 1.5rem;
  font-weight: bold;
}

#alarmBand {
  grid-column: 2;
  justify-self: center;
}

#clock {
  grid-column: 3;
  justify-self: end;
  text-align: right;
  min-width: 90px;
}
    .bed-label {
      font-size: 1.5rem;
      font-weight: bold;
    }

    .vitals {
  grid-column: 1 / 4;
  display: grid;
  grid-template-columns: 2fr 1fr;
  grid-template-rows: repeat(5, 1fr);
  gap: 10px;
  align-content: center;
}
    .tile {
  border: 2px solid #333;
  border-radius: 12px;
  padding: 12px 16px;
  background: #050505;
  min-height: 80px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.wave-row {
  border: 2px solid #333;
  border-radius: 12px;
  background: #020202;
  min-height: 80px;
  display: flex;
  align-items: center;
  padding: 10px 14px;
  box-sizing: border-box;
}

.wave-label {
  width: 70px;
  font-size: 1rem;
  font-weight: bold;
  color: #aaa;
}

.wave-line {
  flex: 1;
  height: 2px;
  background: #222;
  position: relative;
}

.wave-line::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: -1px;
  border-top: 2px dashed #333;
}
.wave-trace {
  flex: 1;
  height: 64px;
  position: relative;
  overflow: hidden;
}

.wave-trace svg {
  width: 100%;
  height: 100%;
  display: block;
}

.wave-trace path,
.wave-trace polyline {
  fill: none;
  stroke: currentColor;
  stroke-width: 3;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.ecg-trace {
  color: #00ff66;
}

.art-trace {
  color: #ff3333;
}

.icp-trace {
  color: #ffd400;
}

.spo2-trace {
  color: #00ccff;
}

.etco2-trace {
  color: #ffd400;
}
.combined-values {
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: end;
  column-gap: 18px;
  white-space: nowrap;
  width: 100%;
}
.value-pair {
  display: flex;
  align-items: baseline;
  gap: 8px;
  min-width: 0;
}
.value-pair:nth-child(2) {
  justify-content: flex-start;
}

.value-pair-label {
  font-size: 1rem;
  color: #aaa;
  font-weight: bold;
}

.map-value {
  color: #ff3333;
}


.value.compact-value {
  font-size: 2.8rem;
}

.compact-tile {
  gap: 6px;
}
    .label {
      font-size: 1.2rem;
      color: #aaa;
      letter-spacing: 1px;
    }

    .value {
      font-size: 4rem;
      font-weight: bold;
      line-height: 1;
    }

    .unit {
      font-size: 1rem;
      color: #aaa;
      margin-left: 6px;
    }

    .green {
      color: #00ff66;
    }

    .blue {
      color: #00ccff;
    }

    .yellow {
      color: #ffd400;
    }

    .red {
      color: #ff3333;
    }

    .purple {
      color: #cc66ff;
    }

    .small-value {
      font-size: 3rem;
    }

    .footer {
      grid-column: 1 / 4;
      border-top: 2px solid #333;
      padding-top: 10px;
      font-size: 1rem;
      color: #888;
      display: flex;
      justify-content: space-between;
    }

    @media (max-width: 900px) {
      
.value.compact-value {
  font-size: 2.8rem;
  line-height: 1;
}
      .value {
        font-size: 3.2rem;
      }

      .small-value {
        font-size: 2.6rem;
      }
    }

    @media (max-width: 600px) {
      .monitor {
        padding: 12px;
        gap: 12px;
      }

      .vitals {
        grid-template-columns: 1fr;
      }

      .tile {
        min-height: 100px;
      }

      .value {
        font-size: 2.8rem;
      }
      .value.compact-value {
  font-size: 2.8rem;
  line-height: 1;
}
    }
    .test-controls {
  grid-column: 1 / 4;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  border-top: 2px solid #333;
  padding-top: 12px;
}

.test-controls button {
  background: #111;
  color: white;
  border: 1px solid #555;
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 1rem;
  cursor: pointer;
}

.test-controls button:hover {
  background: #222;
}

.reset-button {
  border-color: #ff5555 !important;
  color: #ff7777 !important;
}
.sim-controls {
  grid-column: 1 / 4;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  border-top: 2px solid #333;
  padding-top: 12px;
}

.sim-controls button {
  background: #111;
  color: white;
  border: 1px solid #555;
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 1rem;
  cursor: pointer;
}

.sim-controls button:hover {
  background: #222;
}
.alarm-band {
  width: 320px;
  height: 34px;
  box-sizing: border-box;
  padding: 0;
  border-radius: 6px;
  font-size: 1rem;
  font-weight: bold;
  text-align: center;
  letter-spacing: 1px;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  justify-self: center;
}

.alarm-band.hidden {
  visibility: hidden;
  background: transparent;
  color: transparent;
}

.alarm-band.yellow-alarm {
  visibility: visible;
  background: #ffd400;
  color: black;
}

.alarm-band.red-alarm {
  visibility: visible;
  background: #ff3333;
  color: white;
}


.flash-alarm {
  animation: flashAlarm 1.5s infinite;
}

.enable-sound-button {
  position: fixed;
  top: 70px;
  right: 20px;
  z-index: 9999;
  background: #222;
  color: white;
  border: 1px solid #666;
  border-radius: 10px;
  padding: 12px 18px;
  font-size: 1rem;
  cursor: pointer;
}

.enable-sound-button.hidden {
  display: none;
}

@keyframes flashAlarm {
  0% {
    opacity: 1;
  }
  50% {
    opacity: 0.15;
  }
  100% {
    opacity: 1;
  }
}
  </style>
</head>

    function calculateMAP(systolic, diastolic) {
      return Math.round((systolic + (2 * diastolic)) / 3);
    }

    function calculateCPP(map, icp) {
      return Math.round(map - icp);
    }

let cardiacPhase = 0;
let smoothedHr = patient.hr;
let lastCardiacFrameTime = null;

function animateCardiacWaves(timestamp) {
  const cardiacGroups = [
  document.getElementById("artAnimatedGroup"),
  document.getElementById("icpAnimatedGroup"),
  document.getElementById("spo2AnimatedGroup")
].filter(Boolean);

  if (lastCardiacFrameTime === null) {
    lastCardiacFrameTime = timestamp;
  }

  const deltaSeconds = (timestamp - lastCardiacFrameTime) / 1000;
  lastCardiacFrameTime = timestamp;

  smoothedHr += (patient.hr - smoothedHr) * 0.025;

  const beatsPerStrip = 5;
  const stripWidth = 1000;

  const pixelsPerSecond = stripWidth / (beatsPerStrip * (60 / smoothedHr));

  cardiacPhase += pixelsPerSecond * deltaSeconds;

  if (cardiacPhase >= stripWidth) {
    cardiacPhase -= stripWidth;
  }

  cardiacGroups.forEach((group) => {
    group.setAttribute("transform", `translate(${-cardiacPhase} 0)`);
  });

  requestAnimationFrame(animateCardiacWaves);
  
}
let etco2Phase = 0;
let smoothedRr = patient.rr;
let lastEtco2FrameTime = null;

function animateEtco2Wave(timestamp) {
  const etco2Group = document.getElementById("etco2AnimatedGroup");

  if (!etco2Group) {
    requestAnimationFrame(animateEtco2Wave);
    return;
  }

  if (lastEtco2FrameTime === null) {

  }

  const deltaSeconds = (timestamp - lastEtco2FrameTime) / 1000;
  lastEtco2FrameTime = timestamp;

  // Smoothly chase the actual RR
  smoothedRr += (patient.rr - smoothedRr) * 0.025;

  const breathsPerStrip = 4;
  const stripWidth = 1000;

  const pixelsPerSecond = stripWidth / (breathsPerStrip * (60 / smoothedRr));

  etco2Phase += pixelsPerSecond * deltaSeconds;

  if (etco2Phase >= stripWidth) {

  }

  etco2Group.setAttribute("transform", `translate(${-etco2Phase} 0)`);

}

let ecgGeneratedBeats = [];
let ecgLastFrameTime = null;
let ecgTimeSinceLastBeat = 0;
let ecgSeeded = false;

// This is the screen/paper speed.
// Higher = faster leftward movement.
// Lower = slower movement with more complexes visible for the same HR.
const ecgPaperSpeed = 180;

function seedGeneratedEcgBeats() {
  ecgGeneratedBeats = [];

  const secondsPerBeat = 60 / patient.hr;
  const spacing = ecgPaperSpeed * secondsPerBeat;

  // Fill the screen with beats based on current HR
  for (let x = 1000; x > -160; x -= spacing) {
   ecgGeneratedBeats.push({
  x,
  scale: getEcgScaleForHr(patient.hr)
});
  }

  ecgTimeSinceLastBeat = 0;
  ecgSeeded = true;
}

function animateGeneratedEcg(timestamp) {
  const ecgPath = document.getElementById("ecgGeneratedPath");

  if (!ecgPath) {
    requestAnimationFrame(animateGeneratedEcg);
    return;
  }

  if (!ecgSeeded) {
    seedGeneratedEcgBeats();
  }

  if (ecgLastFrameTime === null) {
    ecgLastFrameTime = timestamp;
  }

  const deltaSeconds = (timestamp - ecgLastFrameTime) / 1000;
  ecgLastFrameTime = timestamp;
  
  const secondsPerBeat = 60 / patient.hr;

  ecgTimeSinceLastBeat += deltaSeconds;

  // Add new complexes based on HR timing
  while (ecgTimeSinceLastBeat >= secondsPerBeat) {
    ecgGeneratedBeats.push({ x: 1040, scale: getEcgScaleForHr(patient.hr) });
    ecgTimeSinceLastBeat -= secondsPerBeat;
  }

  // Move all complexes left
  ecgGeneratedBeats.forEach((beat) => {
    beat.x -= ecgPaperSpeed * deltaSeconds;
  });

  // Remove complexes once fully off-screen
  ecgGeneratedBeats = ecgGeneratedBeats.filter((beat) => beat.x > -180);

  ecgPath.setAttribute("d", buildGeneratedEcgPath(ecgGeneratedBeats));

  requestAnimationFrame(animateGeneratedEcg);
}
function getEcgScaleForHr(hr) {
  const secondsPerBeat = 60 / hr;
  const beatSpacing = ecgPaperSpeed * secondsPerBeat;

  // Pinch the complex when beats are closer together
  return Math.min(1, Math.max(0.55, beatSpacing / 140));
}

function buildGeneratedEcgPath(beats) {
  const sortedBeats = [...beats].sort((a, b) => a.x - b.x);

  function ox(value, scale) {
    return value * scale;
  }

  let d = "M 0 66 ";

  sortedBeats.forEach((beat) => {
    const x = beat.x;
    const scale = beat.scale ?? 1;

    d += `
      L ${x + ox(-42, scale)} 66
      L ${x + ox(-32, scale)} 63
      L ${x + ox(-24, scale)} 65
      L ${x + ox(-16, scale)} 66

      L ${x + ox(-5, scale)} 73
      L ${x} 28
      L ${x + ox(5, scale)} 72
      L ${x + ox(16, scale)} 66

      L ${x + ox(28, scale)} 66
      L ${x + ox(40, scale)} 63
      L ${x + ox(50, scale)} 54
      L ${x + ox(60, scale)} 52
      L ${x + ox(70, scale)} 57
      L ${x + ox(80, scale)} 64
      L ${x + ox(92, scale)} 66
    `;
  });

  d += "L 1000 66";
  return d;
}

// Alarm sound handling

let alarmLoopTimeout = null;
let activeAlarmLevel = "none";
let alarmPlayToken = 0;

function setAlarmSound(alarmLevel) {
  // alarmLevel should be: "none", "yellow", or "red"

  const yellowAlarmSound = document.getElementById("yellowAlarmSound");
  const redAlarmSound = document.getElementById("redAlarmSound");

  if (alarmLevel === "none") {
    activeAlarmLevel = "none";
    alarmPlayToken++;
    stopAllAlarmSounds();
    return;
  }

  const currentSound =
    alarmLevel === "red" ? redAlarmSound : yellowAlarmSound;

  const otherSound =
    alarmLevel === "red" ? yellowAlarmSound : redAlarmSound;

  // Always stop the non-priority sound
  otherSound.onended = null;
  otherSound.pause();
  otherSound.currentTime = 0;

  // If same alarm is already active AND actually playing, leave it alone
  if (alarmLevel === activeAlarmLevel && !currentSound.paused) {
    return;
  }

  // Otherwise start/restart the correct alarm
  activeAlarmLevel = alarmLevel;
  alarmPlayToken++;

  if (alarmLoopTimeout !== null) {
    clearTimeout(alarmLoopTimeout);
    alarmLoopTimeout = null;
  }

  currentSound.onended = null;
  currentSound.pause();
  currentSound.currentTime = 0;

  playCurrentAlarmWithGap(alarmPlayToken);
}

function stopAllAlarmSounds() {
  const yellowAlarmSound = document.getElementById("yellowAlarmSound");
  const redAlarmSound = document.getElementById("redAlarmSound");

  if (alarmLoopTimeout !== null) {
    clearTimeout(alarmLoopTimeout);
    alarmLoopTimeout = null;
  }

  yellowAlarmSound.onended = null;
  redAlarmSound.onended = null;

  yellowAlarmSound.pause();
  yellowAlarmSound.currentTime = 0;

  redAlarmSound.pause();
  redAlarmSound.currentTime = 0;
}

function playCurrentAlarmWithGap(token) {
  if (token !== alarmPlayToken) return;
  if (activeAlarmLevel === "none") return;

  const yellowAlarmSound = document.getElementById("yellowAlarmSound");
  const redAlarmSound = document.getElementById("redAlarmSound");

  const soundToPlay =
    activeAlarmLevel === "red" ? redAlarmSound : yellowAlarmSound;

  const soundToStop =
    activeAlarmLevel === "red" ? yellowAlarmSound : redAlarmSound;

  soundToStop.onended = null;
  soundToStop.pause();
  soundToStop.currentTime = 0;

  soundToPlay.currentTime = 0;

  soundToPlay.play().catch(() => {
    // Browser may block sound until user has interacted with the page
  });

  soundToPlay.onended = () => {
    if (token !== alarmPlayToken) return;
    if (activeAlarmLevel === "none") return;

    const gap = activeAlarmLevel === "red" ? 50 : 1500;

    alarmLoopTimeout = setTimeout(() => {
      playCurrentAlarmWithGap(token);
    }, gap);
  };
}

function enableAlarmSound() {
  const yellowAlarmSound = document.getElementById("yellowAlarmSound");
  const redAlarmSound = document.getElementById("redAlarmSound");

  yellowAlarmSound.play().then(() => {

  redAlarmSound.play().then(() => {
    redAlarmSound.pause();
    redAlarmSound.currentTime = 0;
  }).catch(() => {});

  enableButton.classList.add("hidden");
}

function applyWarningColours(map, cpp) {
  const hrElement = document.getElementById("hr");
  const spo2Element = document.getElementById("spo2");
  const icpElement = document.getElementById("icp");
  const cppElement = document.getElementById("cpp");
  const mapElement = document.getElementById("map");

  // Reset normal colours and remove alarm flashing
  hrElement.className = "value green";
  spo2Element.className = "value blue";
  icpElement.className = "value yellow compact-value";
  cppElement.className = "value yellow compact-value";
  mapElement.className = "value compact-value map-value";

  let alarmLevel = "none";
  let alarmMessages = [];

  // ------------------------------
  // RED priority alarms
  // ------------------------------

  if (patient.hr < 50 || patient.hr >= 130) {
    hrElement.classList.add("flash-alarm");
    alarmLevel = "red";
    alarmMessages.push("HR");
  }

  if (patient.spo2 < 92) {
    spo2Element.classList.add("flash-alarm");
    alarmLevel = "red";
    alarmMessages.push("SpO₂");
  }

  if (map < 65) {
    mapElement.classList.add("flash-alarm");
    alarmLevel = "red";
    alarmMessages.push("MAP");
  }

  if (patient.icp > 35) {
    icpElement.classList.add("flash-alarm");
    alarmLevel = "red";
    alarmMessages.push("ICP");
  }

  if (cpp < 50) {
    cppElement.classList.add("flash-alarm");
    alarmLevel = "red";
    alarmMessages.push("CPP");
  }

  // ------------------------------
  // YELLOW alarms only if no red alarm active
  // ------------------------------

  if (alarmLevel !== "red") {
    if (patient.hr >= 120 && patient.hr < 130) {
      hrElement.classList.add("flash-alarm");
      alarmLevel = "yellow";
      alarmMessages.push("HR");
    }

    if (patient.icp > 20 && patient.icp <= 35) {
      icpElement.classList.add("flash-alarm");
      alarmLevel = "yellow";
      alarmMessages.push("ICP");
    }

    if (cpp <= 65 && cpp >= 50) {
      cppElement.classList.add("flash-alarm");
      alarmLevel = "yellow";
      alarmMessages.push("CPP");
    }
  }

  setAlarmSound(alarmLevel);
  updateAlarmBand(alarmLevel, alarmMessages);
}

let activeIntervals = [];
function clearGradualChanges() {
  activeIntervals.forEach(interval => clearInterval(interval));
  activeIntervals = [];
}
function gradualChange(parameter, targetValue, stepAmount, delayMs) {
  const interval = setInterval(() => {
    if (patient[parameter] === targetValue) {
      clearInterval(interval);
      activeIntervals = activeIntervals.filter(item => item !== interval);
      return;
    }

    if (patient[parameter] < targetValue) {
      patient[parameter] = Math.min(patient[parameter] + stepAmount, targetValue);
    } else {
      patient[parameter] = Math.max(patient[parameter] - stepAmount, targetValue);
    }

    updateMonitor();
  }, delayMs);

  activeIntervals.push(interval);
}
function gradualIntChangeOverTime(parameter, targetValue, totalMs) {
  const startValue = patient[parameter];
  const difference = targetValue - startValue;
  const steps = Math.abs(difference);

  if (steps === 0) return;

  const stepDirection = difference > 0 ? 1 : -1;
  const delayMs = totalMs / steps;

  const interval = setInterval(() => {
    if (patient[parameter] === targetValue) {
      clearInterval(interval);
      activeIntervals = activeIntervals.filter(item => item !== interval);
      return;
    }

    patient[parameter] += stepDirection;
    updateMonitor();
  }, delayMs);

  activeIntervals.push(interval);
}

function gradualDecimalChangeOverTime(parameter, targetValue, stepAmount, totalMs) {
  const startValue = patient[parameter];
  const difference = targetValue - startValue;
  const steps = Math.ceil(Math.abs(difference) / stepAmount);

  if (steps === 0) return;

  const delayMs = totalMs / steps;

  const interval = setInterval(() => {
    if (Math.abs(patient[parameter] - targetValue) < stepAmount) {
      patient[parameter] = targetValue;
      clearInterval(interval);
      activeIntervals = activeIntervals.filter(item => item !== interval);
      updateMonitor();
      return;
    }

    if (patient[parameter] < targetValue) {
      patient[parameter] += stepAmount;
    } else {
      patient[parameter] -= stepAmount;
    }

    patient[parameter] = Math.round(patient[parameter] * 10) / 10;
    updateMonitor();
  }, delayMs);

  activeIntervals.push(interval);
}

  gradualIntChangeOverTime("hr", 88, twoMinutes);
  gradualIntChangeOverTime("spo2", 97, twoMinutes);
  gradualIntChangeOverTime("systolic", 135, twoMinutes);
  gradualIntChangeOverTime("diastolic", 65, twoMinutes);
  gradualIntChangeOverTime("icp", 26, twoMinutes);
