<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>Neuro1 Pupil Simulator</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

#face {
    position: absolute;
    inset: 0;
    overflow: hidden;
    touch-action: none;
}

/* All images use the same full-screen canvas */
.face-image {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: fill;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
}

/* Small initial eyelash movement */
.eyelid {
    transform: translateY(0);
    opacity: 1;
    transition:
        transform 0.3s ease-in-out,
        opacity 0.3s ease-in-out;
}

/* Short lift followed by complete disappearance */
.eyelid.open {
    transform: translateY(-5%);
    opacity: 0;
    transition:
        transform 0.3s ease-out,
        opacity 0.3s ease-out;
}

/* Stationary closed-eye overlay */
.static-lid {
    opacity: 1;
    transition: opacity 0.5s ease-in-out;
}

.static-lid.open {
    opacity: 0;
    transition: opacity 0.85s ease-in-out;
}
/* Invisible examination areas */
.eye-touch {
    position: absolute;
    top: 30%;
    width: 35%;
    height: 45%;
    z-index: 10;
    touch-action: none;
    cursor: pointer;
}

/* Patient's LEFT eye = screen RIGHT */
#left-touch {
    right: 7%;
}

/* Patient's RIGHT eye = screen LEFT */
#right-touch {
    left: 7%;
}

</style>
</head>

<body>

<div id="face">

    <!-- Permanent open-eye background -->
    <img
        class="face-image"
        src="eyes-open.png"
        alt="Patient eyes"
    >

    <!-- PATIENT'S LEFT EYE (screen right) -->

    <!-- Static closed-eye overlay -->
    <img
        id="left-static"
        class="face-image static-lid"
        src="eyelid-left-static.png"
        alt=""
    >

    <!-- Moving eyelid and eyelashes -->
    <img
        id="left-lid"
        class="face-image eyelid"
        src="eyelid-left.png"
        alt=""
    >

    <!-- PATIENT'S RIGHT EYE (screen left) -->

    <!-- Moving eyelid only for now -->
    <img
        id="right-lid"
        class="face-image eyelid"
        src="eyelid-right.png"
        alt=""
    >

    <!-- Invisible touch areas -->
    <div id="left-touch" class="eye-touch"></div>
    <div id="right-touch" class="eye-touch"></div>

</div>

<script>

function setupEye(touchId, eyelidId, staticId = null) {

    const touch = document.getElementById(touchId);
    const eyelid = document.getElementById(eyelidId);

    const staticLid = staticId
        ? document.getElementById(staticId)
        : null;

    function openEye(event) {
        event.preventDefault();

        touch.setPointerCapture(event.pointerId);

        // Move eyelid upwards
        eyelid.classList.add("open");

        // Fade stationary overlay
        if (staticLid) {
            staticLid.classList.add("open");
        }
    }

    function closeEye() {

        // Return eyelid to closed position
        eyelid.classList.remove("open");

        // Restore stationary overlay
        if (staticLid) {
            staticLid.classList.remove("open");
        }
    }

    touch.addEventListener("pointerdown", openEye);
    touch.addEventListener("pointerup", closeEye);
    touch.addEventListener("pointercancel", closeEye);
    touch.addEventListener("lostpointercapture", closeEye);
}

/* Patient's LEFT eye */
setupEye("left-touch", "left-lid", "left-static");

/* Patient's RIGHT eye */
setupEye("right-touch", "right-lid");

</script>

</body>
</html>
