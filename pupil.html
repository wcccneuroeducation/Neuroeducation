
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1,
      viewport-fit=cover, user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>Neuro1 Pupil Simulator</title>

<style>

/* GENERAL PAGE SETTINGS */

* {
    box-sizing: border-box;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
    touch-action: none;
    overscroll-behavior: none;
}

/* MAIN FACE CONTAINER */

#face {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    touch-action: none;
}

/* ALL IMAGES SHARE EXACTLY THE SAME CANVAS */

.face-image {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: fill;
    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-user-drag: none;
    -webkit-touch-callout: none;
}

/* STATIC EYELID OVERLAYS */

.static-lid {
    opacity: 1;
    transition: opacity 0.5s ease-in-out;
    will-change: opacity;
}

/* PRESS AND HOLD TO OPEN */

.static-lid.open {
    opacity: 0;
    transition: opacity 0.85s ease-in-out;
}

/* Examination areas extend above the eyes */
.eye-touch {
    position: absolute;
    top: 5%;
    width: 35%;
    height: 70%;
    z-index: 10;
    touch-action: none;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
}

/* PATIENT'S LEFT EYE = SCREEN RIGHT */

#left-touch {
    right: 7%;
}

/* PATIENT'S RIGHT EYE = SCREEN LEFT */

#right-touch {
    left: 7%;
}

</style>
</head>

<body>

<div id="face">

    <!-- PERMANENT OPEN-EYE BACKGROUND -->

    <img
        class="face-image"
        src="eyes-open.png"
        alt=""
        draggable="false"
    >

    <!-- PATIENT'S LEFT EYE - SCREEN RIGHT -->

    <img
        id="left-static"
        class="face-image static-lid"
        src="eyelid-left-static.png"
        alt=""
        draggable="false"
    >

    <!-- PATIENT'S RIGHT EYE - SCREEN LEFT -->
    <!-- Using existing eyelid image temporarily -->

    <img
        id="right-static"
        class="face-image static-lid"
        src="eyelid-right.png"
        alt=""
        draggable="false"
    >

    <!-- INVISIBLE TOUCH AREAS -->

    <div id="left-touch" class="eye-touch"></div>
    <div id="right-touch" class="eye-touch"></div>

</div>

<script>

/* DISABLE SAFARI SELECTION AND LONG-PRESS MENUS */

document.addEventListener("contextmenu", function(event) {
    event.preventDefault();
});

document.addEventListener("dragstart", function(event) {
    event.preventDefault();
});

document.addEventListener("selectstart", function(event) {
    event.preventDefault();
});

/* PREVENT DEFAULT TOUCH BEHAVIOUR ON THE SIMULATOR */

document.getElementById("face").addEventListener(
    "touchstart",
    function(event) {
        event.preventDefault();
    },
    { passive: false }
);

/* INDEPENDENT EYE CONTROLS */

function setupEye(touchId, eyelidId) {

    const touch = document.getElementById(touchId);
    const eyelid = document.getElementById(eyelidId);

    function openEye(event) {
        event.preventDefault();

        if (event.pointerId !== undefined) {
            touch.setPointerCapture(event.pointerId);
        }

        eyelid.classList.add("open");
    }

    function closeEye() {
        eyelid.classList.remove("open");
    }

    touch.addEventListener("pointerdown", openEye);
    touch.addEventListener("pointerup", closeEye);
    touch.addEventListener("pointercancel", closeEye);
    touch.addEventListener("lostpointercapture", closeEye);
}

/* PATIENT'S LEFT EYE */

setupEye("left-touch", "left-static");

/* PATIENT'S RIGHT EYE */

setupEye("right-touch", "right-static");

</script>

</body>
</html>
