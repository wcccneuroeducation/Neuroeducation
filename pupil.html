
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Neuro1 Pupil Simulator</title>

<style>
* {
    box-sizing: border-box;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
}
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
    touch-action: none;
}
#face {
    position: absolute;
    inset: 0;
    overflow: hidden;
}
.face-image {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: fill;
    pointer-events: none;
    -webkit-user-drag: none;
}
.pupil {
    position: absolute;
    width: var(--pupil-size);
    height: var(--pupil-size);
    border-radius: 50%;
    background: #030405;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 2;
    opacity: 0;
    transition: opacity 0.5s ease-in-out;
}
.pupil.visible {
    opacity: 1;
    transition: opacity 0.85s ease-in-out;
}
.static-lid {
    z-index: 3;
    opacity: 1;
    transition: opacity 0.5s ease-in-out;
}
.static-lid.open {
    opacity: 0;
    transition: opacity 0.85s ease-in-out;
}
.eye-touch {
    position: absolute;
    top: 5%;
    width: 35%;
    height: 70%;
    z-index: 10;
    touch-action: none;
    cursor: pointer;
}
#left-touch { right: 7%; }
#right-touch { left: 7%; }

/* Temporary camera diagnostic panel */
#camera-panel {
    position: fixed;
    left: 50%;
    bottom: max(8px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 30;
    background: rgba(0,0,0,0.82);
    color: white;
    border-radius: 10px;
    padding: 7px 12px;
    font: 12px Arial, sans-serif;
    text-align: center;
    touch-action: manipulation;
    min-width: 220px;
}
#camera-panel button {
    background: #2478db;
    color: white;
    border: none;
    border-radius: 6px;
    padding: 8px 14px;
    font-weight: bold;
    font-size: 13px;
    touch-action: manipulation;
}
#camera-status {
    margin-top: 5px;
}
#light-status {
    margin-top: 4px;
    font-weight: bold;
    color: #aaa;
}
#light-status.detected {
    color: #58ff88;
}
#brightness-bar {
    height: 5px;
    background: #444;
    border-radius: 4px;
    margin-top: 6px;
    overflow: hidden;
}
#brightness-fill {
    height: 100%;
    width: 0%;
    background: #58ff88;
}
</style>
</head>

<body>

<div id="face">

    <img class="face-image"
         src="eyes-open-nopupils.png"
         alt="" draggable="false">

    <div id="pupil-screen-left" class="pupil"></div>
    <div id="pupil-screen-right" class="pupil"></div>

    <img id="left-static"
         class="face-image static-lid"
         src="eyelid-left-static.png"
         alt="" draggable="false">

    <img id="right-static"
         class="face-image static-lid"
         src="eyelid-right-static.png"
         alt="" draggable="false">

    <div id="left-touch" class="eye-touch"></div>
    <div id="right-touch" class="eye-touch"></div>

</div>

<!-- Camera test controls -->
<div id="camera-panel">
    <button id="camera-button">Start Front Camera</button>
    <div id="camera-status">Camera not started</div>
    <div id="light-status">Waiting for camera</div>
    <div id="brightness-bar">
        <div id="brightness-fill"></div>
    </div>
</div>

<!-- Camera video is processed, not displayed -->
<video id="camera-video"
       autoplay muted playsinline
       style="display:none"></video>

<canvas id="camera-canvas"
        width="80" height="60"
        style="display:none"></canvas>

<script>

/* ========================================
   PUPIL POSITIONING - FIXED 3 MM
======================================== */

const pupilCenters = {
    left:  { x: 19.52, y: 51.35 },
    right: { x: 82.59, y: 52.29 }
};

const PUPIL_MM = 3;
const IRIS_DIAMETER_PERCENT = 13;

function positionPupils() {
    const face = document.getElementById("face");

    const irisDiameterPx =
        face.clientWidth * IRIS_DIAMETER_PERCENT / 100;

    const pupilDiameterPx =
        irisDiameterPx * (PUPIL_MM / 12);

    const positions = [
        ["pupil-screen-left", pupilCenters.left],
        ["pupil-screen-right", pupilCenters.right]
    ];

    positions.forEach(([id, pos]) => {
        const pupil = document.getElementById(id);
        pupil.style.left = pos.x + "%";
        pupil.style.top = pos.y + "%";
        pupil.style.setProperty(
            "--pupil-size",
            pupilDiameterPx + "px"
        );
    });
}

window.addEventListener("resize", positionPupils);
positionPupils();

/* ========================================
   PREVENT IPHONE SELECTION
======================================== */

document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("dragstart", e => e.preventDefault());
document.addEventListener("selectstart", e => e.preventDefault());

document.getElementById("face").addEventListener(
    "touchstart",
    e => e.preventDefault(),
    { passive: false }
);

/* ========================================
   INDEPENDENT EYELIDS
======================================== */

function setupEye(touchId, eyelidId, pupilId) {
    const touch = document.getElementById(touchId);
    const eyelid = document.getElementById(eyelidId);
    const pupil = document.getElementById(pupilId);

    touch.addEventListener("pointerdown", event => {
        event.preventDefault();
        touch.setPointerCapture(event.pointerId);
        eyelid.classList.add("open");
        pupil.classList.add("visible");
    });

    function closeEye() {
        eyelid.classList.remove("open");
        pupil.classList.remove("visible");
    }

    touch.addEventListener("pointerup", closeEye);
    touch.addEventListener("pointercancel", closeEye);
    touch.addEventListener("lostpointercapture", closeEye);
}

setupEye("left-touch", "left-static", "pupil-screen-right");
setupEye("right-touch", "right-static", "pupil-screen-left");

/* ========================================
   FRONT CAMERA LIGHT DETECTION
======================================== */

const video = document.getElementById("camera-video");
const canvas = document.getElementById("camera-canvas");
const ctx = canvas.getContext("2d", {
    willReadFrequently: true
});

const cameraButton = document.getElementById("camera-button");
const cameraStatus = document.getElementById("camera-status");
const lightStatus = document.getElementById("light-status");
const brightnessFill = document.getElementById("brightness-fill");

let cameraStream = null;
let cameraTimer = null;
let baseline = null;
let detected = false;

/* Test sensitivity - can adjust later */
const LIGHT_THRESHOLD = 25;
const ABSOLUTE_BRIGHTNESS = 225;

cameraButton.addEventListener("click", async () => {
    if (cameraStream) {
        stopCamera();
        return;
    }

    cameraButton.disabled = true;
    cameraStatus.textContent = "Requesting camera permission...";

    try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: {
                facingMode: "user",
                width: { ideal: 320 },
                height: { ideal: 240 }
            }
        });

        video.srcObject = cameraStream;
        await video.play();

        baseline = null;
        detected = false;

        cameraButton.textContent = "Stop Camera";
        cameraStatus.textContent = "Front camera active";

        cameraTimer = setInterval(measureBrightness, 100);

    } catch (error) {
        cameraStatus.textContent =
            "Camera error: " + error.name;
        lightStatus.textContent = error.message;
        stopCamera(false);
    } finally {
        cameraButton.disabled = false;
    }
});

function measureBrightness() {
    if (!video.videoWidth || !video.videoHeight) return;

    ctx.drawImage(video, 0, 0, 80, 60);

    const pixels = ctx.getImageData(0, 0, 80, 60).data;

    let total = 0;
    let brightPixels = 0;
    const count = pixels.length / 4;

    for (let i = 0; i < pixels.length; i += 4) {
        const brightness =
            0.2126 * pixels[i] +
            0.7152 * pixels[i + 1] +
            0.0722 * pixels[i + 2];

        total += brightness;

        if (brightness > 235) {
            brightPixels++;
        }
    }

    const average = total / count;
    const brightPercent = brightPixels / count * 100;

    if (baseline === null) {
        baseline = average;
    }

    const increase = average - baseline;

    /* Detect sudden brightness increase or intense light */
    const lightNow =
        increase > LIGHT_THRESHOLD ||
        average > ABSOLUTE_BRIGHTNESS ||
        (brightPercent > 18 && increase > 10);

    detected = lightNow;

    lightStatus.textContent = detected
        ? "LIGHT DETECTED"
        : "No light detected";

    lightStatus.classList.toggle("detected", detected);

    cameraStatus.textContent =
        "Brightness: " + average.toFixed(1) +
        " | Baseline: " + baseline.toFixed(1) +
        " | Bright pixels: " + brightPercent.toFixed(0) + "%";

    brightnessFill.style.width =
        Math.min(100, average / 255 * 100) + "%";

    /* Slowly adapt to room lighting when no light detected */
    if (!detected) {
        baseline = baseline * 0.98 + average * 0.02;
    }
}

function stopCamera(resetStatus = true) {
    if (cameraTimer) {
        clearInterval(cameraTimer);
        cameraTimer = null;
    }

    if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
    }

    video.srcObject = null;
    baseline = null;
    detected = false;

    cameraButton.textContent = "Start Front Camera";
    lightStatus.textContent = "Waiting for camera";
    lightStatus.classList.remove("detected");
    brightnessFill.style.width = "0%";

    if (resetStatus) {
        cameraStatus.textContent = "Camera stopped";
    }
}

window.addEventListener("pagehide", () => stopCamera());

</script>
</body>
</html>
