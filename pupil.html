<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Neuro1 Pupil Simulator</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:black;touch-action:none;overscroll-behavior:none}
#face{position:absolute;inset:0;overflow:hidden;touch-action:none}
.face-image{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;-webkit-user-drag:none}
.pupil{position:absolute;width:var(--pupil-size);height:var(--pupil-size);border-radius:50%;background:#030405;transform:translate(-50%,-50%);pointer-events:none;z-index:2;opacity:0;transition:opacity .5s ease-in-out,width .3s ease-in-out,height .3s ease-in-out}
.pupil.visible{opacity:1;transition:opacity .85s ease-in-out,width .3s ease-in-out,height .3s ease-in-out}
.static-lid{z-index:3;opacity:1;transition:opacity .5s ease-in-out}
.static-lid.open{opacity:0;transition-duration:.85s}
.eye-touch{position:absolute;top:5%;width:35%;height:70%;z-index:10;touch-action:none;cursor:pointer}
#left-touch{right:7%}#right-touch{left:7%}
#setup-panel{position:fixed;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;width:min(420px,92vw);padding:10px 12px;background:rgba(0,0,0,.9);color:white;border:1px solid #555;border-radius:12px;font:12px Arial,sans-serif;text-align:center;touch-action:manipulation}
#setup-panel.hidden{display:none}.panel-title{font-size:15px;font-weight:bold;margin-bottom:8px}.settings-row{display:flex;gap:8px;align-items:center;justify-content:center;margin-bottom:8px}.settings-row label{white-space:nowrap}.settings-row input{width:65px;padding:5px;font-size:15px;text-align:center;border-radius:5px;border:1px solid #888;background:#222;color:white;touch-action:manipulation}
.panel-buttons{display:flex;gap:8px;justify-content:center}#setup-panel button{border:0;border-radius:6px;padding:8px 12px;font-size:12px;font-weight:bold;color:white;background:#2478db;touch-action:manipulation}#begin-button{background:#16864a!important}#camera-status,#brightness-status,#light-status,#firebase-status{margin-top:5px}#light-status.detected{color:#58ff88;font-weight:bold}#brightness-bar{height:5px;background:#444;border-radius:4px;margin-top:6px;overflow:hidden}#brightness-fill{height:100%;width:0%;background:#58ff88}#instructor-corner{position:fixed;bottom:0;left:0;width:65px;height:55px;z-index:20;touch-action:none}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body>
<div id="face">
<img class="face-image" src="eyes-open-nopupils.png" alt="" draggable="false">
<div id="pupil-screen-left" class="pupil"></div>
<div id="pupil-screen-right" class="pupil"></div>
<img id="left-static" class="face-image static-lid" src="eyelid-left-static.png" alt="" draggable="false">
<img id="right-static" class="face-image static-lid" src="eyelid-right-static.png" alt="" draggable="false">
<div id="left-touch" class="eye-touch"></div>
<div id="right-touch" class="eye-touch"></div>
</div>
<div id="setup-panel">
<div class="panel-title">Neuro1 Pupil Setup</div>
<div class="settings-row"><label for="left-code">Patient LEFT</label><input id="left-code" value="321" readonly><label for="right-code">RIGHT</label><input id="right-code" value="322" readonly></div>
<div class="panel-buttons"><button id="camera-button">Activate Camera</button><button id="begin-button">Begin Simulation</button></div>
<div id="firebase-status">Firebase: connecting...</div>
<div id="camera-status">Camera not started</div><div id="brightness-status">Brightness: --</div><div id="light-status">Waiting for camera</div>
<div id="brightness-bar"><div id="brightness-fill"></div></div>
</div>
<div id="instructor-corner"></div>
<video id="camera-video" autoplay muted playsinline style="display:none"></video>
<canvas id="camera-canvas" width="80" height="60" style="display:none"></canvas>
<script>
/* Firebase: read pupil codes only; never overwrite monitor settings. */
const firebaseConfig={
 apiKey:"AIzaSyDQOx2eQRwPFlHC2EmQREtdFYb9Mha7zuQ",
 authDomain:"neuro-itu-monitor-sim.firebaseapp.com",
 databaseURL:"https://neuro-itu-monitor-sim-default-rtdb.europe-west1.firebasedatabase.app",
 projectId:"neuro-itu-monitor-sim",
 storageBucket:"neuro-itu-monitor-sim.firebasestorage.app",
 messagingSenderId:"610257056899",
 appId:"1:610257056899:web:4763a538136eaf95a8d7b6"
};
const pupilCenters={left:{x:19.52,y:51.35},right:{x:82.59,y:52.29}};
const IRIS_DIAMETER_PERCENT=13;
function parsePupilCode(value){
 const code=String(value??"").trim();
 if(!/^[1-8][0-8][012]$/.test(code))throw Error("Invalid pupil code: "+code);
 const resting=Number(code[0]),constricted=Number(code[1]),response=Number(code[2]);
 if(response===0&&resting!==constricted)throw Error("Fixed pupil sizes must match");
 if(response!==0&&(constricted<1||constricted>=resting))throw Error("Reactive pupil must constrict");
 return {code,resting,constricted,response};
}
let pupilSettings={left:parsePupilCode("321"),right:parsePupilCode("322")};
const pupilElements={left:document.getElementById("pupil-screen-right"),right:document.getElementById("pupil-screen-left")};
let currentSizes={left:3,right:3};
let responseTimers=[];
let lastLightTime=0;
function pupilPixels(mm){return document.getElementById("face").clientWidth*IRIS_DIAMETER_PERCENT/100*(mm/12)}
function positionPupils(){
 const positions={left:pupilCenters.right,right:pupilCenters.left};
 for(const eye of ["left","right"]){const p=pupilElements[eye],pos=positions[eye];p.style.left=pos.x+"%";p.style.top=pos.y+"%";p.style.setProperty("--pupil-size",pupilPixels(currentSizes[eye])+"px")}
}
function setPupilSize(eye,mm,duration=.3){
 currentSizes[eye]=mm;
 const p=pupilElements[eye];
 p.style.transitionDuration=".85s, "+duration+"s, "+duration+"s";
 p.style.setProperty("--pupil-size",pupilPixels(mm)+"px");
}
window.addEventListener("resize",positionPupils);positionPupils();
document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("dragstart",e=>e.preventDefault());
document.addEventListener("selectstart",e=>e.preventDefault());
document.getElementById("face").addEventListener("touchstart",e=>e.preventDefault(),{passive:false});
function setupEye(touchId,eyelidId,pupilId){
 const touch=document.getElementById(touchId),eyelid=document.getElementById(eyelidId),pupil=document.getElementById(pupilId);
 touch.addEventListener("pointerdown",e=>{e.preventDefault();touch.setPointerCapture(e.pointerId);eyelid.classList.add("open");pupil.classList.add("visible")});
 function closeEye(){eyelid.classList.remove("open");pupil.classList.remove("visible")}
 touch.addEventListener("pointerup",closeEye);touch.addEventListener("pointercancel",closeEye);touch.addEventListener("lostpointercapture",closeEye);
}
setupEye("left-touch","left-static","pupil-screen-right");
setupEye("right-touch","right-static","pupil-screen-left");
function clearResponseTimers(){responseTimers.forEach(clearTimeout);responseTimers=[]}
function resetPupils(){clearResponseTimers();for(const eye of ["left","right"])setPupilSize(eye,pupilSettings[eye].resting,.2)}
function triggerLightResponse(){
 const now=Date.now();if(now-lastLightTime<2200)return;
 lastLightTime=now;clearResponseTimers();
 for(const eye of ["left","right"]){
  const setting=pupilSettings[eye];if(setting.response===0)continue;
  const brisk=setting.response===1,constrictionTime=brisk?.3:2.0,recoveryTime=brisk?.65:1.2;
  setPupilSize(eye,setting.constricted,constrictionTime);
  responseTimers.push(setTimeout(()=>setPupilSize(eye,setting.resting,recoveryTime),constrictionTime*1000+700));
 }
}
/* Realtime Firebase listeners for the two existing values. */
const firebaseStatus=document.getElementById("firebase-status");
try{
 firebase.initializeApp(firebaseConfig);
 const database=firebase.database();
 const roomRef=database.ref("simRooms/neuro1");
 database.ref(".info/connected").on("value",snap=>{
  firebaseStatus.textContent=snap.val()?"Firebase: connected":"Firebase: disconnected (last values retained)";
 });
 for(const eye of ["left","right"]){
  const key=eye==="left"?"pupilLeft":"pupilRight";
  roomRef.child(key).on("value",snap=>{
   if(!snap.exists())return;
   try{
    const next=parsePupilCode(snap.val());
    if(next.code===pupilSettings[eye].code)return;
    pupilSettings[eye]=next;
    document.getElementById(eye+"-code").value=next.code;
    // Cancel any in-progress response and apply both new resting sizes.
    resetPupils();
   }catch(err){firebaseStatus.textContent="Firebase: "+key+" invalid ("+err.message+")"}
  },err=>{firebaseStatus.textContent="Firebase read error: "+err.message});
 }
}catch(err){firebaseStatus.textContent="Firebase setup error: "+err.message}
/* Camera detector: preserved from the tested version. */
const video=document.getElementById("camera-video"),canvas=document.getElementById("camera-canvas"),ctx=canvas.getContext("2d",{willReadFrequently:true});
const cameraButton=document.getElementById("camera-button"),cameraStatus=document.getElementById("camera-status"),brightnessStatus=document.getElementById("brightness-status"),lightStatus=document.getElementById("light-status"),brightnessFill=document.getElementById("brightness-fill");
let cameraStream=null,cameraTimer=null,baseline=null,previousBrightPercent=null,lightArmed=true,lastBrightSpike=0;
const LIGHT_THRESHOLD=25,BRIGHT_PIXEL_JUMP=15,BRIGHT_PIXEL_MINIMUM=18;
cameraButton.addEventListener("click",async()=>{
 if(cameraStream){stopCamera();return}
 cameraButton.disabled=true;cameraStatus.textContent="Requesting camera...";
 try{
  cameraStream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:"user",width:{ideal:320},height:{ideal:240}}});
  video.srcObject=cameraStream;await video.play();baseline=null;previousBrightPercent=null;lightArmed=true;
  cameraButton.textContent="Stop Camera";cameraStatus.textContent="Front camera active";
  cameraTimer=setInterval(measureBrightness,100);
 }catch(err){cameraStatus.textContent="Camera error: "+err.name;lightStatus.textContent=err.message;stopCamera(false)}finally{cameraButton.disabled=false}
});
function measureBrightness(){
 if(!video.videoWidth||!video.videoHeight)return;
 ctx.drawImage(video,0,0,80,60);
 const pixels=ctx.getImageData(0,0,80,60).data;
 let total=0,brightPixels=0;const count=pixels.length/4;
 for(let i=0;i<pixels.length;i+=4){const b=.2126*pixels[i]+.7152*pixels[i+1]+.0722*pixels[i+2];total+=b;if(b>235)brightPixels++}
 const average=total/count,brightPercent=brightPixels/count*100;
 if(baseline===null)baseline=average;
 const increase=average-baseline,brightJump=previousBrightPercent===null?0:brightPercent-previousBrightPercent;
 const lightNow=(brightPercent>=BRIGHT_PIXEL_MINIMUM&&brightJump>=BRIGHT_PIXEL_JUMP)||(increase>LIGHT_THRESHOLD&&brightPercent>10);
 const now=Date.now();
 if(lightNow){lastBrightSpike=now;if(lightArmed){lightArmed=false;triggerLightResponse()}}
 if(!lightArmed&&now-lastBrightSpike>1800&&now-lastLightTime>2200&&brightPercent<12)lightArmed=true;
 lightStatus.textContent=lightNow?"LIGHT DETECTED":(lightArmed?"Ready for torch":"Response / reset");
 lightStatus.classList.toggle("detected",lightNow);
 brightnessStatus.textContent="Brightness: "+average.toFixed(1)+" | Bright pixels: "+brightPercent.toFixed(0)+"%";
 brightnessFill.style.width=Math.min(100,brightPercent)+"%";
 if(!lightNow)baseline=baseline*.98+average*.02;
 previousBrightPercent=brightPercent;
}
function stopCamera(resetStatus=true){
 if(cameraTimer){clearInterval(cameraTimer);cameraTimer=null}
 if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}
 video.srcObject=null;baseline=null;previousBrightPercent=null;lightArmed=true;
 cameraButton.textContent="Activate Camera";lightStatus.textContent="Waiting for camera";lightStatus.classList.remove("detected");brightnessFill.style.width="0%";
 if(resetStatus)cameraStatus.textContent="Camera stopped";
}
const setupPanel=document.getElementById("setup-panel");
document.getElementById("begin-button").addEventListener("click",()=>{
 if(!cameraStream){alert("Activate the front camera first.");return}
 setupPanel.classList.add("hidden");
});
const corner=document.getElementById("instructor-corner");let cornerTimer=null;
corner.addEventListener("pointerdown",e=>{e.preventDefault();corner.setPointerCapture(e.pointerId);cornerTimer=setTimeout(()=>{setupPanel.classList.remove("hidden");cornerTimer=null},3000)});
function cancelCornerHold(){if(cornerTimer!==null){clearTimeout(cornerTimer);cornerTimer=null}}
corner.addEventListener("pointerup",cancelCornerHold);corner.addEventListener("pointercancel",cancelCornerHold);corner.addEventListener("lostpointercapture",cancelCornerHold);
window.addEventListener("pagehide",()=>stopCamera());
</script>
</body>
</html>
