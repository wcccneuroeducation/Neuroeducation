
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1,
      viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style"
      content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Neuro1 Pupil Simulator</title>

<style>
* {
    box-sizing: border-box;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
    touch-action: none;
    overscroll-behavior: none;
}

#face {
    position: absolute;
    inset: 0;
    overflow: hidden;
    touch-action: none;
}

.face-image {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: fill;
    pointer-events: none;
    -webkit-user-drag: none;
}

/* PUPILS */

.pupil {
    position: absolute;
    width: var(--pupil-size);
    height: var(--pupil-size);
    border-radius: 50%;
    background: #030405;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 2;
    opacity: 0;
    transition:
        opacity 0.5s ease-in-out,
        width 0.3s ease-in-out,
        height 0.3s ease-in-out;
}

.pupil.visible {
    opacity: 1;
    transition:
        opacity 0.85s ease-in-out,
        width 0.3s ease-in-out,
        height 0.3s ease-in-out;
}

/* EYELIDS */

.static-lid {
    z-index: 3;
    opacity: 1;
    transition: opacity 0.5s ease-in-out;
}

.static-lid.open {
    opacity: 0;
    transition-duration: 0.85s;
}

/* TOUCH AREAS */

.eye-touch {
    position: absolute;
    top: 5%;
    width: 35%;
    height: 70%;
    z-index: 10;
    touch-action: none;
    cursor: pointer;
}

#left-touch { right: 7%; }
#right-touch { left: 7%; }

/* SETUP PANEL */

#setup-panel {
    position: fixed;
    left: 50%;
    bottom: max(8px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 30;
    width: min(420px, 92vw);
    padding: 10px 12px;
    background: rgba(0, 0, 0, 0.9);
    color: white;
    border: 1px solid #555;
    border-radius: 12px;
    font: 12px Arial, sans-serif;
    text-align: center;
    touch-action: manipulation;
}

#setup-panel.hidden {
    display: none;
}

.panel-title {
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 8px;
}

.settings-row {
    display: flex;
    gap: 8px;
    align-items: center;
    justify-content: center;
    margin-bottom: 8px;
}

.settings-row label {
    white-space: nowrap;
}

.settings-row input {
    width: 65px;
    padding: 5px;
    font-size: 15px;
    text-align: center;
    border-radius: 5px;
    border: 1px solid #888;
    background: #222;
    color: white;
    touch-action: manipulation;
}

.panel-buttons {
    display: flex;
    gap: 8px;
    justify-content: center;
}

#setup-panel button {
    border: none;
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 12px;
    font-weight: bold;
    color: white;
    background: #2478db;
    touch-action: manipulation;
}

#begin-button {
    background: #16864a !important;
}

#camera-status,
#brightness-status,
#light-status {
    margin-top: 5px;
}

#light-status.detected {
    color: #58ff88;
    font-weight: bold;
}

#brightness-bar {
    height: 5px;
    background: #444;
    border-radius: 4px;
    margin-top: 6px;
    overflow: hidden;
}

#brightness-fill {
    height: 100%;
    width: 0%;
    background: #58ff88;
}

/* INVISIBLE INSTRUCTOR CORNER */

#instructor-corner {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 65px;
    height: 55px;
    z-index: 20;
    touch-action: none;
}

</style>
</head>

<body>

<div id="face">

    <img class="face-image"
         src="eyes-open-nopupils.png"
         alt="" draggable="false">

    <div id="pupil-screen-left" class="pupil"></div>
    <div id="pupil-screen-right" class="pupil"></div>

    <img id="left-static"
         class="face-image static-lid"
         src="eyelid-left-static.png"
         alt="" draggable="false">

    <img id="right-static"
         class="face-image static-lid"
         src="eyelid-right-static.png"
         alt="" draggable="false">

    <div id="left-touch" class="eye-touch"></div>
    <div id="right-touch" class="eye-touch"></div>

</div>

<!-- INSTRUCTOR SETUP -->

<div id="setup-panel">

    <div class="panel-title">Neuro1 Pupil Setup</div>

    <div class="settings-row">
        <label for="left-code">Patient LEFT</label>
        <input id="left-code"
               type="text"
               inputmode="numeric"
               maxlength="3"
               value="321">

        <label for="right-code">RIGHT</label>
        <input id="right-code"
               type="text"
               inputmode="numeric"
               maxlength="3"
               value="322">
    </div>

    <div class="panel-buttons">
        <button id="camera-button">Activate Camera</button>
        <button id="begin-button">Begin Simulation</button>
    </div>

    <div id="camera-status">Camera not started</div>
    <div id="brightness-status">Brightness: --</div>
    <div id="light-status">Waiting for camera</div>

    <div id="brightness-bar">
        <div id="brightness-fill"></div>
    </div>

</div>

<div id="instructor-corner"></div>

<video id="camera-video"
       autoplay muted playsinline
       style="display:none"></video>

<canvas id="camera-canvas"
        width="80" height="60"
        style="display:none"></canvas>

<script>

/* ========================================
   PUPIL CONFIGURATION
======================================== */

const pupilCenters = {
    left:  { x: 19.52, y: 51.35 },
    right: { x: 82.59, y: 52.29 }
};

const IRIS_DIAMETER_PERCENT = 13;

/*
Pupil codes:
321 = 3 mm to 2 mm, brisk
322 = 3 mm to 2 mm, sluggish
770 = 7 mm fixed
821 = 8 mm to 2 mm, brisk

First digit: resting size
Second digit: constricted size
Third digit: response
0 = fixed
1 = brisk
2 = sluggish
*/

function parsePupilCode(code) {
    if (!/^[1-8][0-8][012]$/.test(code)) {
        throw new Error("Enter a valid three-digit pupil code.");
    }

    const resting = Number(code[0]);
    const constricted = Number(code[1]);
    const response = Number(code[2]);

    if (response === 0 && resting !== constricted) {
        throw new Error("Fixed pupils must have equal sizes.");
    }

    if (response !== 0 &&
        (constricted < 1 || constricted >= resting)) {
        throw new Error("Reactive pupils need a smaller final size.");
    }

    return { resting, constricted, response };
}

let pupilSettings = {
    left: parsePupilCode("321"),
    right: parsePupilCode("322")
};

/* Patient's LEFT is screen RIGHT */
const pupilElements = {
    left: document.getElementById("pupil-screen-right"),
    right: document.getElementById("pupil-screen-left")
};

let currentSizes = {
    left: pupilSettings.left.resting,
    right: pupilSettings.right.resting
};

let responseTimers = [];
let lastLightTime = 0;

/* ========================================
   POSITION AND SIZE PUPILS
======================================== */

function pupilPixels(mm) {
    const face = document.getElementById("face");
    const irisDiameterPx =
        face.clientWidth * IRIS_DIAMETER_PERCENT / 100;

    return irisDiameterPx * (mm / 12);
}

function positionPupils() {
    const positions = {
        left: pupilCenters.right,
        right: pupilCenters.left
    };

    ["left", "right"].forEach(eye => {
        const pupil = pupilElements[eye];
        const pos = positions[eye];

        pupil.style.left = pos.x + "%";
        pupil.style.top = pos.y + "%";

        pupil.style.setProperty(
            "--pupil-size",
            pupilPixels(currentSizes[eye]) + "px"
        );
    });
}

function setPupilSize(eye, mm, duration = 0.3) {
    currentSizes[eye] = mm;

    const pupil = pupilElements[eye];

    pupil.style.transitionDuration =
        "0.85s, " + duration + "s, " + duration + "s";

    pupil.style.setProperty(
        "--pupil-size",
        pupilPixels(mm) + "px"
    );
}

window.addEventListener("resize", positionPupils);
positionPupils();

/* ========================================
   IPHONE SELECTION PREVENTION
======================================== */

document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("dragstart", e => e.preventDefault());
document.addEventListener("selectstart", e => e.preventDefault());

document.getElementById("face").addEventListener(
    "touchstart",
    e => e.preventDefault(),
    { passive: false }
);

/* ========================================
   EYELID CONTROLS
======================================== */

function setupEye(touchId, eyelidId, pupilId) {
    const touch = document.getElementById(touchId);
    const eyelid = document.getElementById(eyelidId);
    const pupil = document.getElementById(pupilId);

    touch.addEventListener("pointerdown", event => {
        event.preventDefault();
        touch.setPointerCapture(event.pointerId);
        eyelid.classList.add("open");
        pupil.classList.add("visible");
    });

    function closeEye() {
        eyelid.classList.remove("open");
        pupil.classList.remove("visible");
    }

    touch.addEventListener("pointerup", closeEye);
    touch.addEventListener("pointercancel", closeEye);
    touch.addEventListener("lostpointercapture", closeEye);
}

setupEye(
    "left-touch",
    "left-static",
    "pupil-screen-right"
);

setupEye(
    "right-touch",
    "right-static",
    "pupil-screen-left"
);


/* ========================================
   PUPIL LIGHT RESPONSE
======================================== */

function clearResponseTimers() {
    responseTimers.forEach(clearTimeout);
    responseTimers = [];
}

function resetPupils() {
    clearResponseTimers();

    ["left", "right"].forEach(eye => {
        setPupilSize(
            eye,
            pupilSettings[eye].resting,
            0.2
        );
    });
}

function triggerLightResponse() {
    const now = Date.now();

    /* Prevent repeated triggers from camera exposure */
    if (now - lastLightTime < 2200) return;

    lastLightTime = now;
    clearResponseTimers();

    ["left", "right"].forEach(eye => {

        const setting = pupilSettings[eye];

        /* Fixed pupil: no response */
        if (setting.response === 0) return;

        const isBrisk = setting.response === 1;

        /* Different constriction speeds */
        const constrictionTime = isBrisk ? 0.3 : 2.0;

        /* Hold after constriction finishes */
        const holdTime = isBrisk ? 700 : 700;

        /* Different recovery speeds */
        const recoveryTime = isBrisk ? 0.65 : 1.2;

        /* Start constriction */
        setPupilSize(
            eye,
            setting.constricted,
            constrictionTime
        );

        /* Recover independently after constriction + hold */
        const recoveryDelay =
            constrictionTime * 1000 + holdTime;

        responseTimers.push(setTimeout(() => {
            setPupilSize(
                eye,
                setting.resting,
                recoveryTime
            );
        }, recoveryDelay));
    });
}


/* ========================================
   CAMERA LIGHT DETECTION
======================================== */

const video = document.getElementById("camera-video");
const canvas = document.getElementById("camera-canvas");
const ctx = canvas.getContext("2d", {
    willReadFrequently: true
});

const cameraButton = document.getElementById("camera-button");
const cameraStatus = document.getElementById("camera-status");
const brightnessStatus = document.getElementById("brightness-status");
const lightStatus = document.getElementById("light-status");
const brightnessFill = document.getElementById("brightness-fill");

let cameraStream = null;
let cameraTimer = null;
let baseline = null;
let previousBrightPercent = null;
let lightArmed = true;
let lastBrightSpike = 0;

/* Tune these after testing on the iPhone */
const LIGHT_THRESHOLD = 25;
const BRIGHT_PIXEL_JUMP = 15;
const BRIGHT_PIXEL_MINIMUM = 18;

cameraButton.addEventListener("click", async () => {
    if (cameraStream) {
        stopCamera();
        return;
    }

    cameraButton.disabled = true;
    cameraStatus.textContent = "Requesting camera...";

    try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: {
                facingMode: "user",
                width: { ideal: 320 },
                height: { ideal: 240 }
            }
        });

        video.srcObject = cameraStream;
        await video.play();

        baseline = null;
        previousBrightPercent = null;
        lightArmed = true;

        cameraButton.textContent = "Stop Camera";
        cameraStatus.textContent = "Front camera active";

        cameraTimer = setInterval(measureBrightness, 100);

    } catch (error) {
        cameraStatus.textContent =
            "Camera error: " + error.name;
        lightStatus.textContent = error.message;
        stopCamera(false);
    } finally {
        cameraButton.disabled = false;
    }
});

function measureBrightness() {
    if (!video.videoWidth || !video.videoHeight) return;

    ctx.drawImage(video, 0, 0, 80, 60);
    const pixels = ctx.getImageData(0, 0, 80, 60).data;

    let total = 0;
    let brightPixels = 0;
    const count = pixels.length / 4;

    for (let i = 0; i < pixels.length; i += 4) {
        const brightness =
            0.2126 * pixels[i] +
            0.7152 * pixels[i + 1] +
            0.0722 * pixels[i + 2];

        total += brightness;

        if (brightness > 235) brightPixels++;
    }

    const average = total / count;
    const brightPercent = brightPixels / count * 100;

    if (baseline === null) baseline = average;

    const increase = average - baseline;
    const brightJump =
        previousBrightPercent === null
            ? 0
            : brightPercent - previousBrightPercent;

    const lightNow =
        (brightPercent >= BRIGHT_PIXEL_MINIMUM &&
         brightJump >= BRIGHT_PIXEL_JUMP) ||
        (increase > LIGHT_THRESHOLD &&
         brightPercent > 10);

    const now = Date.now();

    if (lightNow) {
        lastBrightSpike = now;

        if (lightArmed) {
            lightArmed = false;
            triggerLightResponse();
        }
    }

    /*
    Rearm after the brightness settles and
    the cooldown has elapsed.
    */
    if (!lightArmed &&
        now - lastBrightSpike > 1800 &&
        now - lastLightTime > 2200 &&
        brightPercent < 12) {
        lightArmed = true;
    }

    lightStatus.textContent = lightNow
        ? "LIGHT DETECTED"
        : (lightArmed ? "Ready for torch" : "Response / reset");

    lightStatus.classList.toggle("detected", lightNow);

    brightnessStatus.textContent =
        "Brightness: " + average.toFixed(1) +
        " | Bright pixels: " + brightPercent.toFixed(0) + "%";

    brightnessFill.style.width =
        Math.min(100, brightPercent) + "%";

    if (!lightNow) {
        baseline = baseline * 0.98 + average * 0.02;
    }

    previousBrightPercent = brightPercent;
}

function stopCamera(resetStatus = true) {
    if (cameraTimer) {
        clearInterval(cameraTimer);
        cameraTimer = null;
    }

    if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
    }

    video.srcObject = null;
    baseline = null;
    previousBrightPercent = null;
    lightArmed = true;

    cameraButton.textContent = "Activate Camera";
    lightStatus.textContent = "Waiting for camera";
    lightStatus.classList.remove("detected");
    brightnessFill.style.width = "0%";

    if (resetStatus) {
        cameraStatus.textContent = "Camera stopped";
    }
}

/* ========================================
   INSTRUCTOR SETUP
======================================== */

const setupPanel = document.getElementById("setup-panel");
const beginButton = document.getElementById("begin-button");

function applyPupilCodes() {
    try {
        const leftCode =
            document.getElementById("left-code").value.trim();

        const rightCode =
            document.getElementById("right-code").value.trim();

        const newLeft = parsePupilCode(leftCode);
        const newRight = parsePupilCode(rightCode);

        pupilSettings.left = newLeft;
        pupilSettings.right = newRight;

        resetPupils();
        return true;

    } catch (error) {
        alert(error.message);
        return false;
    }
}

beginButton.addEventListener("click", () => {
    if (!cameraStream) {
        alert("Activate the front camera first.");
        return;
    }

    if (!applyPupilCodes()) return;

    setupPanel.classList.add("hidden");
});

/* HOLD BOTTOM-LEFT FOR 3 SECONDS */

const corner = document.getElementById("instructor-corner");
let cornerTimer = null;

corner.addEventListener("pointerdown", event => {
    event.preventDefault();
    corner.setPointerCapture(event.pointerId);

    cornerTimer = setTimeout(() => {
        setupPanel.classList.remove("hidden");
        cornerTimer = null;
    }, 3000);
});

function cancelCornerHold() {
    if (cornerTimer !== null) {
        clearTimeout(cornerTimer);
        cornerTimer = null;
    }
}

corner.addEventListener("pointerup", cancelCornerHold);
corner.addEventListener("pointercancel", cancelCornerHold);
corner.addEventListener("lostpointercapture", cancelCornerHold);

window.addEventListener("pagehide", () => stopCamera());

</script>
</body>
</html>
