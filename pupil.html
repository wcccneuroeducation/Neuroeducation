
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1,
      viewport-fit=cover, user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>Neuro1 Pupil Simulator</title>

<style>
* {
    box-sizing: border-box;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
    touch-action: none;
    overscroll-behavior: none;
}

#face {
    position: absolute;
    inset: 0;
    overflow: hidden;
    touch-action: none;
}

/* All images use the same canvas */
.face-image {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: fill;
    pointer-events: none;
    -webkit-user-drag: none;
}

/* Black pupil circles */
.pupil {
    position: absolute;
    width: var(--pupil-size);
    height: var(--pupil-size);
    border-radius: 50%;
    background: #030405;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 2;
}

/* Static eyelids sit above pupils */
.static-lid {
    z-index: 3;
    opacity: 1;
    transition: opacity 0.5s ease-in-out;
}

.static-lid.open {
    opacity: 0;
    transition-duration: 0.85s;
}

/* Invisible examination areas */
.eye-touch {
    position: absolute;
    top: 5%;
    width: 35%;
    height: 70%;
    z-index: 10;
    touch-action: none;
    cursor: pointer;
}

/* Patient's LEFT = screen RIGHT */
#left-touch {
    right: 7%;
}

/* Patient's RIGHT = screen LEFT */
#right-touch {
    left: 7%;
}
</style>
</head>

<body>

<div id="face">

    <!-- Pupil-free background -->
    <img class="face-image"
         src="eyes-open-nopupils.png"
         alt=""
         draggable="false">

    <!-- Screen-left pupil: patient's RIGHT -->
    <div id="pupil-screen-left" class="pupil"></div>

    <!-- Screen-right pupil: patient's LEFT -->
    <div id="pupil-screen-right" class="pupil"></div>

    <!-- Patient's LEFT eyelid -->
    <img id="left-static"
         class="face-image static-lid"
         src="eyelid-left-static.png"
         alt=""
         draggable="false">

    <!-- Patient's RIGHT eyelid -->
    <img id="right-static"
         class="face-image static-lid"
         src="eyelid-right-static.png"
         alt=""
         draggable="false">

    <!-- Touch areas -->
    <div id="left-touch" class="eye-touch"></div>
    <div id="right-touch" class="eye-touch">

</div>

<script>

/* Pupil positions as percentages of full image */
const pupilCenters = {
    left:  { x: 19.52, y: 51.35 },
    right: { x: 82.59, y: 52.29 }
};

/*
 * Initial pupil calibration:
 * Assume iris diameter = approximately 12 mm.
 * Adjust IRIS_DIAMETER_PERCENT after testing.
 */
const PUPIL_MM = 3;
const IRIS_DIAMETER_PERCENT = 13;

/* Position pupils */
function positionPupils() {
    const face = document.getElementById("face");

    const irisDiameterPx =
        face.clientWidth * IRIS_DIAMETER_PERCENT / 100;

    const pupilDiameterPx =
        irisDiameterPx * (PUPIL_MM / 12);

    const positions = [
        ["pupil-screen-left", pupilCenters.left],
        ["pupil-screen-right", pupilCenters.right]
    ];

    positions.forEach(([id, pos]) => {
        const pupil = document.getElementById(id);

        pupil.style.left = pos.x + "%";
        pupil.style.top = pos.y + "%";
        pupil.style.setProperty(
            "--pupil-size",
            pupilDiameterPx + "px"
        );
    });
}

window.addEventListener("resize", positionPupils);
positionPupils();

/* Disable iPhone selection and context menus */
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("dragstart", e => e.preventDefault());
document.addEventListener("selectstart", e => e.preventDefault());

document.getElementById("face").addEventListener(
    "touchstart",
    e => e.preventDefault(),
    { passive: false }
);

/* Independent press-and-hold eyelids */
function setupEye(touchId, eyelidId) {
    const touch = document.getElementById(touchId);
    const eyelid = document.getElementById(eyelidId);

    touch.addEventListener("pointerdown", event => {
        event.preventDefault();
        touch.setPointerCapture(event.pointerId);
        eyelid.classList.add("open");
    });

    function closeEye() {
        eyelid.classList.remove("open");
    }

    touch.addEventListener("pointerup", closeEye);
    touch.addEventListener("pointercancel", closeEye);
    touch.addEventListener("lostpointercapture", closeEye);
}

setupEye("left-touch", "left-static");
setupEye("right-touch", "right-static");

</script>
</body>
</html>
