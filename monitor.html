<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ITU Monitor Sim</title>

  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    .monitor {
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: auto 1fr auto;
      gap: 12px;
      padding: 14px;
      box-sizing: border-box;
    }

    .header {
  grid-column: 1 / 4;
  height: 54px;
  display: grid;
  grid-template-columns: 1fr 360px 1fr;
  align-items: center;
  border-bottom: 2px solid #333;
  padding-bottom: 0;
  font-size: 1.2rem;
  color: #ccc;
}

.bed-label {
  grid-column: 1;
  justify-self: start;
  font-size: 1.5rem;
  font-weight: bold;
}

#alarmBand {
  grid-column: 2;
  justify-self: center;
}

#clock {
  grid-column: 3;
  justify-self: end;
  text-align: right;
  min-width: 90px;
}
    .bed-label {
      font-size: 1.5rem;
      font-weight: bold;
    }

    .vitals {
  grid-column: 1 / 4;
  display: grid;
  grid-template-columns: 2fr 1fr;
  grid-template-rows: repeat(5, 1fr);
  gap: 10px;
  align-content: center;
}
    .tile {
  border: 2px solid #333;
  border-radius: 12px;
  padding: 12px 16px;
  background: #050505;
  min-height: 80px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.wave-row {
  border: 2px solid #333;
  border-radius: 12px;
  background: #020202;
  min-height: 80px;
  display: flex;
  align-items: center;
  padding: 10px 14px;
  box-sizing: border-box;
}

.wave-label {
  width: 70px;
  font-size: 1rem;
  font-weight: bold;
  color: #aaa;
}

.wave-line {
  flex: 1;
  height: 2px;
  background: #222;
  position: relative;
}

.wave-line::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: -1px;
  border-top: 2px dashed #333;
}
.wave-trace {
  flex: 1;
  height: 64px;
  position: relative;
  overflow: hidden;
}

.wave-trace svg {
  width: 100%;
  height: 100%;
  display: block;
}

.wave-trace path,
.wave-trace polyline {
  fill: none;
  stroke: currentColor;
  stroke-width: 3;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.ecg-trace {
  color: #00ff66;
}

.art-trace {
  color: #ff3333;
}

.icp-trace {
  color: #ffd400;
}

.spo2-trace {
  color: #00ccff;
}

.etco2-trace {
  color: #ffd400;
}
.combined-values {
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: end;
  column-gap: 18px;
  white-space: nowrap;
  width: 100%;
}
.value-pair {
  display: flex;
  align-items: baseline;
  gap: 8px;
  min-width: 0;
}
.value-pair:nth-child(2) {
  justify-content: flex-start;
}

.value-pair-label {
  font-size: 1rem;
  color: #aaa;
  font-weight: bold;
}

.map-value {
  color: #ff3333;
}


.value.compact-value {
  font-size: 2.8rem;
}

.compact-tile {
  gap: 6px;
}
    .label {
      font-size: 1.2rem;
      color: #aaa;
      letter-spacing: 1px;
    }

    .value {
      font-size: 4rem;
      font-weight: bold;
      line-height: 1;
    }

    .unit {
      font-size: 1rem;
      color: #aaa;
      margin-left: 6px;
    }

    .green {
      color: #00ff66;
    }

    .blue {
      color: #00ccff;
    }

    .yellow {
      color: #ffd400;
    }

    .red {
      color: #ff3333;
    }

    .purple {
      color: #cc66ff;
    }

    .small-value {
      font-size: 3rem;
    }

    .footer {
      grid-column: 1 / 4;
      border-top: 2px solid #333;
      padding-top: 10px;
      font-size: 1rem;
      color: #888;
      display: flex;
      justify-content: space-between;
    }

    @media (max-width: 900px) {
      
.value.compact-value {
  font-size: 2.8rem;
  line-height: 1;
}
      .value {
        font-size: 3.2rem;
      }

      .small-value {
        font-size: 2.6rem;
      }
    }

    @media (max-width: 600px) {
      .monitor {
        padding: 12px;
        gap: 12px;
      }

      .vitals {
        grid-template-columns: 1fr;
      }

      .tile {
        min-height: 100px;
      }

      .value {
        font-size: 2.8rem;
      }
      .value.compact-value {
  font-size: 2.8rem;
  line-height: 1;
}
    }
    .test-controls {
  grid-column: 1 / 4;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  border-top: 2px solid #333;
  padding-top: 12px;
}

.test-controls button {
  background: #111;
  color: white;
  border: 1px solid #555;
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 1rem;
  cursor: pointer;
}

.test-controls button:hover {
  background: #222;
}

.reset-button {
  border-color: #ff5555 !important;
  color: #ff7777 !important;
}
.sim-controls {
  grid-column: 1 / 4;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  border-top: 2px solid #333;
  padding-top: 12px;
}

.sim-controls button {
  background: #111;
  color: white;
  border: 1px solid #555;
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 1rem;
  cursor: pointer;
}

.sim-controls button:hover {
  background: #222;
}
.alarm-band {
  width: 320px;
  height: 34px;
  box-sizing: border-box;
  padding: 0;
  border-radius: 6px;
  font-size: 1rem;
  font-weight: bold;
  text-align: center;
  letter-spacing: 1px;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  justify-self: center;
}

.alarm-band.hidden {
  visibility: hidden;
  background: transparent;
  color: transparent;
}

.alarm-band.yellow-alarm {
  visibility: visible;
  background: #ffd400;
  color: black;
}

.alarm-band.red-alarm {
  visibility: visible;
  background: #ff3333;
  color: white;
}


.flash-alarm {
  animation: flashAlarm 1.5s infinite;
}

.enable-sound-button {
  position: fixed;
  top: 70px;
  right: 20px;
  z-index: 9999;
  background: #222;
  color: white;
  border: 1px solid #666;
  border-radius: 10px;
  padding: 12px 18px;
  font-size: 1rem;
  cursor: pointer;
}

.enable-sound-button.hidden {
  display: none;
}

@keyframes flashAlarm {
  0% {
    opacity: 1;
  }
  50% {
    opacity: 0.15;
  }
  100% {
    opacity: 1;
  }
}
  </style>
</head>

    // ------------------------------

roomRef.on("value", (snapshot) => {

  if (!data) return;

    // ------------------------------
    // Calculation functions
    // ------------------------------

    function calculateMAP(systolic, diastolic) {
      return Math.round((systolic + (2 * diastolic)) / 3);
    }

    function calculateCPP(map, icp) {
      return Math.round(map - icp);
    }

    // ------------------------------
    // Update monitor display
    // ------------------------------

    function updateMonitor() {
      const map = calculateMAP(patient.systolic, patient.diastolic);
      const cpp = calculateCPP(map, patient.icp);

      document.getElementById("hr").textContent = patient.hr;
      document.getElementById("spo2").textContent = patient.spo2;
      document.getElementById("bp").textContent = `${patient.systolic}/${patient.diastolic}`;
      document.getElementById("map").textContent = map;
      document.getElementById("icp").textContent = patient.icp;
      document.getElementById("cpp").textContent = cpp;
      document.getElementById("rr").textContent = patient.rr;
      document.getElementById("etco2").textContent = patient.etco2.toFixed(1);
      document.getElementById("scenario").textContent = `Scenario: ${patient.scenario}`;

      applyWarningColours(map, cpp);
    }
function updateAlarmBand(alarmLevel, alarmMessages) {
  const alarmBand = document.getElementById("alarmBand");

  if (alarmLevel === "none" || alarmMessages.length === 0) {
    alarmBand.className = "alarm-band hidden";
    alarmBand.textContent = "";
    return;
  }

  if (alarmLevel === "red") {
    alarmBand.className = "alarm-band red-alarm";
    alarmBand.textContent = alarmMessages.join(" / ");
    return;
  }

  if (alarmLevel === "yellow") {
    alarmBand.className = "alarm-band yellow-alarm";
    alarmBand.textContent = alarmMessages.join(" / ");
  }
}
    // ------------------------------
    // Simple colour warnings
    // ------------------------------

   // ------------------------------
// Alarm sound handling
// ------------------------------

let alarmLoopTimeout = null;
let activeAlarmLevel = "none";
let alarmPlayToken = 0;

function setAlarmSound(alarmLevel) {
  // alarmLevel should be: "none", "yellow", or "red"

  const yellowAlarmSound = document.getElementById("yellowAlarmSound");
  const redAlarmSound = document.getElementById("redAlarmSound");

  if (alarmLevel === "none") {
    activeAlarmLevel = "none";
    alarmPlayToken++;
    stopAllAlarmSounds();
    return;
  }

  const currentSound =
    alarmLevel === "red" ? redAlarmSound : yellowAlarmSound;

  const otherSound =
    alarmLevel === "red" ? yellowAlarmSound : redAlarmSound;

  // Always stop the non-priority sound
  otherSound.onended = null;
  otherSound.pause();
  otherSound.currentTime = 0;

  // If same alarm is already active AND actually playing, leave it alone
  if (alarmLevel === activeAlarmLevel && !currentSound.paused) {
    return;
  }

  // Otherwise start/restart the correct alarm
  activeAlarmLevel = alarmLevel;
  alarmPlayToken++;

  if (alarmLoopTimeout !== null) {
    clearTimeout(alarmLoopTimeout);
    alarmLoopTimeout = null;
  }

  currentSound.onended = null;
  currentSound.pause();
  currentSound.currentTime = 0;

  playCurrentAlarmWithGap(alarmPlayToken);
}

function stopAllAlarmSounds() {
  const yellowAlarmSound = document.getElementById("yellowAlarmSound");
  const redAlarmSound = document.getElementById("redAlarmSound");

  if (alarmLoopTimeout !== null) {
    clearTimeout(alarmLoopTimeout);
    alarmLoopTimeout = null;
  }

  yellowAlarmSound.onended = null;
  redAlarmSound.onended = null;

  yellowAlarmSound.pause();
  yellowAlarmSound.currentTime = 0;

  redAlarmSound.pause();
  redAlarmSound.currentTime = 0;
}

function playCurrentAlarmWithGap(token) {
  if (token !== alarmPlayToken) return;
  if (activeAlarmLevel === "none") return;

  const yellowAlarmSound = document.getElementById("yellowAlarmSound");
  const redAlarmSound = document.getElementById("redAlarmSound");

  const soundToPlay =
    activeAlarmLevel === "red" ? redAlarmSound : yellowAlarmSound;

  const soundToStop =
    activeAlarmLevel === "red" ? yellowAlarmSound : redAlarmSound;

  soundToStop.onended = null;
  soundToStop.pause();
  soundToStop.currentTime = 0;

  soundToPlay.currentTime = 0;

  soundToPlay.play().catch(() => {
    // Browser may block sound until user has interacted with the page
  });

  soundToPlay.onended = () => {
    if (token !== alarmPlayToken) return;
    if (activeAlarmLevel === "none") return;

    const gap = activeAlarmLevel === "red" ? 50 : 1500;

    alarmLoopTimeout = setTimeout(() => {
      playCurrentAlarmWithGap(token);
    }, gap);
  };
}

function enableAlarmSound() {
  const yellowAlarmSound = document.getElementById("yellowAlarmSound");
  const redAlarmSound = document.getElementById("redAlarmSound");
  const enableButton = document.getElementById("enableSoundButton");

  yellowAlarmSound.play().then(() => {
    yellowAlarmSound.pause();
    yellowAlarmSound.currentTime = 0;
  }).catch(() => {});

  redAlarmSound.play().then(() => {
    redAlarmSound.pause();
    redAlarmSound.currentTime = 0;
  }).catch(() => {});

  enableButton.classList.add("hidden");
}
// ------------------------------
// Alarm visual logic
// ------------------------------
function applyWarningColours(map, cpp) {
  const hrElement = document.getElementById("hr");
  const spo2Element = document.getElementById("spo2");
  const icpElement = document.getElementById("icp");
  const cppElement = document.getElementById("cpp");
  const mapElement = document.getElementById("map");

  // Reset normal colours and remove alarm flashing
  hrElement.className = "value green";
  spo2Element.className = "value blue";
  icpElement.className = "value yellow compact-value";
  cppElement.className = "value yellow compact-value";
  mapElement.className = "value compact-value map-value";

  let alarmLevel = "none";
  let alarmMessages = [];

  // ------------------------------
  // RED priority alarms
  // ------------------------------

  if (patient.hr < 50 || patient.hr >= 130) {
    hrElement.classList.add("flash-alarm");
    alarmLevel = "red";
    alarmMessages.push("HR");
  }

  if (patient.spo2 < 92) {
    spo2Element.classList.add("flash-alarm");
    alarmLevel = "red";
    alarmMessages.push("SpO₂");
  }

  if (map < 65) {
    mapElement.classList.add("flash-alarm");
    alarmLevel = "red";
    alarmMessages.push("MAP");
  }

  if (patient.icp > 35) {
    icpElement.classList.add("flash-alarm");
    alarmLevel = "red";
    alarmMessages.push("ICP");
  }

  if (cpp < 50) {
    cppElement.classList.add("flash-alarm");
    alarmLevel = "red";
    alarmMessages.push("CPP");
  }

  // ------------------------------
  // YELLOW alarms only if no red alarm active
  // ------------------------------

  if (alarmLevel !== "red") {
    if (patient.hr >= 120 && patient.hr < 130) {
      hrElement.classList.add("flash-alarm");
      alarmLevel = "yellow";
      alarmMessages.push("HR");
    }

    if (patient.icp > 20 && patient.icp <= 35) {
      icpElement.classList.add("flash-alarm");
      alarmLevel = "yellow";
      alarmMessages.push("ICP");
    }

    if (cpp <= 65 && cpp >= 50) {
      cppElement.classList.add("flash-alarm");
      alarmLevel = "yellow";
      alarmMessages.push("CPP");
    }
  }

  setAlarmSound(alarmLevel);
  updateAlarmBand(alarmLevel, alarmMessages);
}

    // Clock
    // ------------------------------

    function updateClock() {
      const now = new Date();
      const timeString = now.toLocaleTimeString("en-GB", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });

      document.getElementById("clock").textContent = timeString;
    }

// ------------------------------
// Basic test controls
// ------------------------------

const baselinePatient = {
  hr: 86,
  spo2: 98,
  systolic: 126,
  diastolic: 74,
  icp: 14,
  rr: 16,
  etco2: 4.8,
  scenario: "Baseline"
};

function changeValue(parameter, amount) {
  patient[parameter] += amount;

  // Basic safety limits to keep values realistic
  patient.hr = clamp(patient.hr, 30, 220);
  patient.spo2 = clamp(patient.spo2, 50, 100);
  patient.systolic = clamp(patient.systolic, 50, 240);
  patient.diastolic = clamp(patient.diastolic, 20, 140);
  patient.icp = clamp(patient.icp, 0, 80);
  patient.rr = clamp(patient.rr, 0, 50);
  patient.etco2 = clamp(patient.etco2, 1.0, 12.0);

  // Keep systolic above diastolic
  if (patient.systolic <= patient.diastolic) {
    patient.systolic = patient.diastolic + 5;
  }

  patient.scenario = "Manual test";
  updateMonitor();
}

function clamp(value, min, max) {
  return Math.min(Math.max(value, min), max);
}

function resetPatient() {
  clearGradualChanges();resetSimTimer();
  simState.sedationGiven = false;
  patient.hr = baselinePatient.hr;
  patient.spo2 = baselinePatient.spo2;
  patient.systolic = baselinePatient.systolic;
  patient.diastolic = baselinePatient.diastolic;
  patient.icp = baselinePatient.icp;
  patient.rr = baselinePatient.rr;
  patient.etco2 = baselinePatient.etco2;
  patient.scenario = baselinePatient.scenario;

  updateMonitor();
}
function startSimTimer() {
  stopSimTimer();

  simState.timerSeconds = 0;
  updateSimTimerDisplay();

  simState.timerInterval = setInterval(() => {
    simState.timerSeconds++;
    updateSimTimerDisplay();
  }, 1000);
}

function stopSimTimer() {
  if (simState.timerInterval !== null) {
    clearInterval(simState.timerInterval);
    simState.timerInterval = null;
  }
}

function resetSimTimer() {
  stopSimTimer();
  simState.timerSeconds = 0;
  updateSimTimerDisplay();
}

function updateSimTimerDisplay() {
  const minutes = Math.floor(simState.timerSeconds / 60);
  const seconds = simState.timerSeconds % 60;

  const timeText =
    String(minutes).padStart(2, "0") +
    ":" +
    String(seconds).padStart(2, "0");

  document.getElementById("simTimer").textContent = `Sim timer: ${timeText}`;
}
// ------------------------------
// Scenario buttons
// ------------------------------
let activeIntervals = [];
function clearGradualChanges() {
  activeIntervals.forEach(interval => clearInterval(interval));
  activeIntervals = [];
}
function gradualChange(parameter, targetValue, stepAmount, delayMs) {
  const interval = setInterval(() => {
    if (patient[parameter] === targetValue) {
      clearInterval(interval);
      activeIntervals = activeIntervals.filter(item => item !== interval);
      return;
    }

    if (patient[parameter] < targetValue) {
      patient[parameter] = Math.min(patient[parameter] + stepAmount, targetValue);
    } else {
      patient[parameter] = Math.max(patient[parameter] - stepAmount, targetValue);
    }

    updateMonitor();
  }, delayMs);

  activeIntervals.push(interval);
}
function gradualIntChangeOverTime(parameter, targetValue, totalMs) {
  const startValue = patient[parameter];
  const difference = targetValue - startValue;
  const steps = Math.abs(difference);

  if (steps === 0) return;

  const stepDirection = difference > 0 ? 1 : -1;
  const delayMs = totalMs / steps;

  const interval = setInterval(() => {
    if (patient[parameter] === targetValue) {
      clearInterval(interval);
      activeIntervals = activeIntervals.filter(item => item !== interval);
      return;
    }

    patient[parameter] += stepDirection;
    updateMonitor();
  }, delayMs);

  activeIntervals.push(interval);
}

function gradualDecimalChangeOverTime(parameter, targetValue, stepAmount, totalMs) {
  const startValue = patient[parameter];
  const difference = targetValue - startValue;
  const steps = Math.ceil(Math.abs(difference) / stepAmount);

  if (steps === 0) return;

  const delayMs = totalMs / steps;

  const interval = setInterval(() => {
    if (Math.abs(patient[parameter] - targetValue) < stepAmount) {
      patient[parameter] = targetValue;
      clearInterval(interval);
      activeIntervals = activeIntervals.filter(item => item !== interval);
      updateMonitor();
      return;
    }

    if (patient[parameter] < targetValue) {
      patient[parameter] += stepAmount;
    } else {
      patient[parameter] -= stepAmount;
    }

    patient[parameter] = Math.round(patient[parameter] * 10) / 10;
    updateMonitor();
  }, delayMs);

  activeIntervals.push(interval);
}
function scenarioRaisedICP() {
  patient.icp = 30;
  patient.hr = 58;
  patient.systolic = 158;
  patient.diastolic = 86;
  patient.rr = 12;
  patient.etco2 = 5.8;
  patient.scenario = "Raised ICP";

  updateMonitor();
}

function scenarioHeadUp() {
  patient.scenario = "Head up 30° / neutral neck";
  updateMonitor();

  const targetICP = clamp(patient.icp - 8, 0, 80);

  gradualChange("icp", targetICP, 1, 3000);
}

function scenarioSedation() {
  patient.hr = clamp(patient.hr - 18, 30, 220);
  patient.systolic = clamp(patient.systolic - 22, 50, 240);
  patient.diastolic = clamp(patient.diastolic - 10, 20, 140);
  patient.icp = clamp(patient.icp - 8, 0, 80);
  patient.rr = clamp(patient.rr - 0, 0, 50);
  patient.etco2 = clamp(patient.etco2 + 0.4, 1.0, 12.0);
  patient.scenario = "Sedation increased";

  updateMonitor();
}

function scenarioNorad() {
  patient.systolic = clamp(patient.systolic + 22, 50, 240);
  patient.diastolic = clamp(patient.diastolic + 12, 20, 140);
  patient.hr = clamp(patient.hr - 5, 30, 220);
  patient.scenario = "Norad increased";

  updateMonitor();
}
// ------------------------------
// Autoregulation Sim Logic
// ------------------------------

function simStartKinked() {
  clearGradualChanges();
  simState.sedationGiven = false;
  startSimTimer();

  // Start from baseline while learners are entering / setting up
  patient.hr = 86;
  patient.spo2 = 98;
  patient.systolic = 126;
  patient.diastolic = 74;
  patient.icp = 14;
  patient.rr = 16;
  patient.etco2 = 4.8;
  patient.scenario = "Start: deterioration over 2 minutes";

  updateMonitor();

  const twoMinutes = 120000;

  // Gradually move into the slumped / neck kinked state
  gradualIntChangeOverTime("hr", 88, twoMinutes);
  gradualIntChangeOverTime("spo2", 97, twoMinutes);
  gradualIntChangeOverTime("systolic", 135, twoMinutes);
  gradualIntChangeOverTime("diastolic", 65, twoMinutes);
  gradualIntChangeOverTime("icp", 26, twoMinutes);
  gradualIntChangeOverTime("rr", 16, twoMinutes);
  gradualDecimalChangeOverTime("etco2", 4.6, 0.1, twoMinutes);
}

function simBasicCare() {
  clearGradualChanges();
  patient.scenario = "Basic nursing care: head up / neutral neck";
  updateMonitor();

  // ICP improves gradually after positioning and reducing venous obstruction
  gradualChange("icp", clamp(patient.icp - 10, 0, 80), 1, 2000);

  // BP settles slightly as stimulation reduces
  gradualChange("systolic", clamp(patient.systolic - 8, 50, 240), 2, 3000);
  gradualChange("diastolic", clamp(patient.diastolic - 4, 20, 140), 1, 3000);
}

function simAgitatedRise() {
  clearGradualChanges();
  simState.sedationGiven = false;

  patient.scenario = "Awake / agitated: ICP rising";
  updateMonitor();

  // Patient becomes more stimulated: BP rises, HR rises, ICP rises more prominently
  gradualChange("hr", clamp(patient.hr + 12, 30, 220), 3, 2000);
  gradualChange("systolic", clamp(patient.systolic + 22, 50, 240), 4, 2000);
  gradualChange("diastolic", clamp(patient.diastolic + 10, 20, 140), 2, 2000);
  gradualChange("icp", clamp(patient.icp + 16, 0, 80), 2, 2000);
  gradualChange("etco2", clamp(patient.etco2 + 0.3, 1.0, 12.0), 0.1, 3000);
}

function simNoradEarly() {
  clearGradualChanges();
  patient.scenario = "Norad before sedation: ICP worsens";
  updateMonitor();

  // In this sim, BP augmentation before ICP/sedation control worsens ICP
  gradualChange("systolic", clamp(patient.systolic + 25, 50, 240), 5, 2000);
  gradualChange("diastolic", clamp(patient.diastolic + 5, 20, 140), 2, 2000);
  gradualChange("icp", clamp(patient.icp + 11, 0, 80), 2, 2000);
  gradualChange("hr", clamp(patient.hr - 4, 30, 220), 1, 3000);
}

function simSedationFirst() {
  clearGradualChanges();
  simState.sedationGiven = true;

  patient.scenario = "Sedation increased: ICP improving";
  updateMonitor();

  // Sedation reduces agitation-driven ICP but may also drop BP
  gradualChange("hr", clamp(patient.hr - 15, 30, 220), 3, 2000);
  gradualChange("systolic", clamp(patient.systolic - 18, 50, 240), 3, 2000);
  gradualChange("diastolic", clamp(patient.diastolic - 8, 20, 140), 2, 2000);
  gradualChange("icp", clamp(patient.icp - 14, 0, 80), 2, 2000);
  gradualChange("rr", clamp(patient.rr - 0, 0, 50), 1, 3000);
  gradualChange("etco2", clamp(patient.etco2 + 0.2, 1.0, 12.0), 0.1, 3000);
}

function simNoradAfterSedation() {
  clearGradualChanges();
  if (!simState.sedationGiven) {
    simNoradEarly();
    return;
  }

  patient.scenario = "Norad after sedation: CPP improving";
  updateMonitor();

  // After sedation/ICP control, BP augmentation improves CPP without worsening ICP
  gradualChange("systolic", clamp(patient.systolic + 24, 50, 240), 4, 2000);
  gradualChange("diastolic", clamp(patient.diastolic + 12, 20, 140), 2, 2000);
  gradualChange("hr", clamp(patient.hr - 4, 30, 220), 1, 3000);

  // ICP remains stable or slightly improves
  gradualChange("icp", clamp(patient.icp - 2, 0, 80), 1, 4000);
}
    updateMonitor();
    updateClock();
    updateSimTimerDisplay();

    setInterval(updateClock, 1000);
